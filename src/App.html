<script>
(function () {
  'use strict';

  var state = {
    init: null,
    view: '',
    preview: null,   // hasil previewWeChat
    text: '',        // teks yang dipratinjau = teks yang akan diimpor
    other: '',
    sel: {},         // id -> dicentang?
    disc: {},        // id -> Discipline pilihan
    translate: true, // false setelah memilih "Lanjut tanpa terjemahan"
    newSheetFrom: '', // 'menu' (dialog sendiri) atau 'paste' (dari tautan "+ Sheet baru")
    importView: 'paste', // langkah impor terakhir, dipulihkan saat kembali ke Impor
    result: null,    // hasil impor terakhir (layar Selesai)
    edits: {},       // id -> { KEY_KOLOM: isi sel yang diubah manual } (lihat Edit.gs)
    editing: {},     // id -> kartu sedang dalam mode edit?
    reporter: {},    // id -> pelapor yang dipilih manual (menimpa nama dari header chat)
    machinePick: {}, // id -> baris Daftar Mesin yang dipilih untuk Machine (C)
    machineListInfo: null, // { managed, url } setelah daftar dibuat dari halaman ini
    written: [],     // hasil impor terakhir (untuk teks chat)
    extraNames: { pic: [], rep: [] }, // nama baru yang diketik di sesi ini
    cmp: null,       // hasil listIncomplete + filter
    cmpPic: {},      // "sheet|baris" -> PIC yang dipilih di Lengkapi (belum disimpan)
    dash: null,      // hasil getDashboard + posisi heatmap/filter
    dashStale: false
  };

  var ICON = {
    pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    stack: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>'
  };

  // Baris yang harus diisi teknisi di teks chat, per kolom kosong.
  var ASK = {
    ROOT_CAUSE: 'Root cause',
    SOLUTION: 'Solusi',
    DISCIPLINE: 'Kategori (Machine / Operation / Product Item / MES)',
    PIC: 'PIC',
    END_TIME: 'Jam selesai',
    DATE: 'Tanggal',
    MACHINE: 'Mesin / line',
    DESC: 'Masalah'
  };

  var MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  var DAY = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

  // ---------- util ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(new Error((e && e.message) || String(e)));
      });
      r[fn].apply(r, args);
    });
  }
  function cleanErr(e) { return String(e.message || e).replace(/^(Error|Exception):\s*/, ''); }
  function flash(msg, kind) {
    flashHtml(msg ? esc(msg) : '', kind);
  }
  function flashHtml(html, kind) {
    $('flash').innerHTML = html ? '<div class="alert ' + (kind || 'err') + '">' + html + '</div>' : '';
    if (html) window.scrollTo(0, 0);
  }
  function busy(btn, on, label) {
    if (on) { btn.dataset.label = btn.textContent; btn.textContent = label; btn.disabled = true; btn.classList.add('is-busy'); }
    else { btn.textContent = btn.dataset.label || btn.textContent; btn.disabled = false; btn.classList.remove('is-busy'); }
  }
  function empty(text) { return '<span class="empty">' + esc(text || 'kosong') + '</span>'; }
  function colChips(list) {
    return list.map(function (y) { return '<span class="col-chip">' + esc(y.col) + '</span>'; }).join('');
  }
  function selectable(r) { return r.writable && !r.sheetError; }
  function hasChinese(s) { return /[一-鿿]/.test(String(s || '')); }
  function isEmptyStr(s) { return !String(s || '').trim(); }
  function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function swap(el, html) {
    if (!el) return null;
    var t = document.createElement('div');
    t.innerHTML = html;
    var node = t.firstChild;
    el.parentNode.replaceChild(node, el);
    return node;
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()); }
  function parseYmd(s) {
    var m = /^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/.exec(String(s || '').trim());
    if (!m) return null;
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    return d.getMonth() === +m[2] - 1 ? d : null;
  }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function dayMonth(d) { return d.getDate() + ' ' + MON[d.getMonth()]; }
  function minutesOf(s) { var m = /^(\d{1,2}):(\d{2})$/.exec(String(s || '').trim()); return m ? +m[1] * 60 + +m[2] : null; }
  function minutesBetween(a, b) {
    var x = minutesOf(a), y = minutesOf(b);
    return x !== null && y !== null && y >= x ? y - x : null;
  }
  function oneLine(s) { return String(s || '').replace(/\s*\n\s*/g, ' · ').trim(); }
  /** "中文\n(English)" -> "English"; teks biasa apa adanya (untuk chat & daftar). */
  function plainText(v) {
    v = String(v || '');
    var i = v.indexOf('\n(');
    return i !== -1 && /\)\s*$/.test(v) ? v.slice(i + 2).replace(/\)\s*$/, '') : v;
  }
  /** "a, b; c" -> ['a', 'b', 'c'] tanpa duplikat (huruf besar/kecil diabaikan). Sama dengan splitPics_. */
  function splitNames(s) {
    var seen = {};
    return String(s || '').split(/\s*[,;、\n]\s*/).map(function (n) { return n.replace(/\s+/g, ' ').trim(); })
      .filter(function (n) {
        var k = n.toLowerCase();
        if (!n || /^[\s\-–—\/.?]*$/.test(n) || seen[k]) return false;
        seen[k] = true;
        return true;
      });
  }
  /** Sama dengan withReporter_ (Parser.gs): pelapor di akhir K, di kedua baris kalau K dua bahasa. */
  function withReporter(k, name) {
    name = String(name || '').trim();
    k = String(k || '');
    if (!name) return k;
    var i = k.lastIndexOf('\n(');
    if (i !== -1 && k.charAt(k.length - 1) === ')') {
      return k.slice(0, i) + '；报告人：' + name + '\n(' + k.slice(i + 2, -1) + '; Reporter: ' + name + ')';
    }
    return k + (k ? ' | ' : '') + 'Pelapor: ' + name;
  }
  function setBadge(n) { $('cmp-badge').textContent = n ? n : ''; }
  var toastTimer = null;
  /** Pesan singkat di bawah layar (tanpa menggulung halaman). */
  function toast(msg, kind) { toastHtml(esc(msg), kind); }
  function toastHtml(html, kind) {
    var t = $('toast');
    t.innerHTML = html;
    t.className = 'toast ' + (kind || 'ok');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.add('hidden'); }, 6000);
  }

  // ---------- navigasi ----------
  var VIEWS = ['dash', 'paste', 'preview', 'result', 'newsheet', 'complete'];
  var IMPORT_VIEWS = ['paste', 'preview', 'result'];

  function show(view) {
    state.view = view;
    VIEWS.forEach(function (v) { $('view-' + v).classList.toggle('hidden', v !== view); });
    $('actionbar').classList.toggle('hidden', view !== 'preview');
    var idx = IMPORT_VIEWS.indexOf(view);
    $('steps').classList.toggle('hidden', idx === -1);
    if (idx !== -1) state.importView = view;
    each('#steps li', function (li) {
      var i = IMPORT_VIEWS.indexOf(li.getAttribute('data-step'));
      li.className = i === idx ? 'on' : (i < idx ? 'done' : '');
    });
    setHeader(view);
    window.scrollTo(0, 0);
  }

  /** Tombol bulat kiri/kanan: kiri = Impor (di Ringkasan) atau kembali; kanan = Lengkapi (+ jumlah) atau Impor. */
  function setHeader(view) {
    $('view-title').textContent = { dash: 'WeChat Import', complete: 'Lengkapi', newsheet: 'Sheet baru' }[view] || 'Impor laporan';
    var L = $('hbtn-left'), R = $('hbtn-right');
    if (view === 'dash') headBtn(L, 'pencil', 'Impor laporan WeChat', 'import');
    else if (view === 'newsheet') headBtn(L, 'back', 'Kembali ke impor', 'paste');
    else headBtn(L, 'back', 'Ringkasan', 'dash');
    if (view === 'complete') headBtn(R, 'pencil', 'Impor laporan WeChat', 'import');
    else headBtn(R, 'check', 'Lengkapi Root Cause / Solution', 'complete');
    R.classList.toggle('no-count', view === 'complete');
    var fromMenu = view === 'newsheet' && state.newSheetFrom === 'menu';
    L.style.visibility = fromMenu ? 'hidden' : '';
    R.style.visibility = view === 'newsheet' ? 'hidden' : '';
  }
  function headBtn(b, icon, label, go) {
    b.setAttribute('data-go', go);
    b.setAttribute('aria-label', label);
    b.title = label;
    b.querySelector('.ico').innerHTML = ICON[icon];
  }

  function go(where) {
    if (where === 'dash') openDash();
    else if (where === 'complete') openComplete();
    else if (where === 'paste') closeNewSheet();
    else if (where === 'import') {
      flash('');
      show(state.importView);
      if (state.importView === 'paste') $('src').focus();
    }
  }

  function boot() {
    if (APP_MODE === 'newsheet') {
      openNewSheet('menu');
      loadInit().catch(function (e) { flash('Gagal memuat: ' + cleanErr(e)); });
      return;
    }
    loadInit().catch(function (e) { flash('Gagal memuat: ' + cleanErr(e)); });
    if (APP_MODE === 'complete') openComplete();
    else if (APP_MODE === 'dialog') { show('paste'); loadDashboard(); }
    else openDash();
  }

  /** Muat daftar sheet & rute proyek; `prefer` = sheet yang dipilih di "Sheet untuk proyek lain". */
  function loadInit(prefer) {
    return call('getInitData').then(function (d) {
      state.init = d;
      $('ss-name').textContent = d.spreadsheetName + ' · versi ' + d.version;
      if (d.version !== CLIENT_VERSION) {
        flash('Versi Code.gs (' + d.version + ') berbeda dengan Index.html (' + CLIENT_VERSION + '). ' +
          'Copy ulang KEDUA file dari dist/, simpan, lalu (web app) buat versi deployment baru.');
      }
      var pick = prefer && d.sheets.indexOf(prefer) !== -1 ? prefer : d.defaultOther;
      $('other').innerHTML = d.sheets.map(function (n) {
        return '<option value="' + esc(n) + '"' + (n === pick ? ' selected' : '') + '>' + esc(n) + '</option>';
      }).join('');
      $('other').disabled = !d.sheets.length;
      $('routes').innerHTML = d.projectSheets.map(function (p) {
        return '<span class="route' + (p.ok ? '' : ' bad') + '"><b>' + esc(p.project) + '</b> → ' + esc(p.sheet) +
          (p.ok ? '' : ' (sheet tidak ditemukan)') + '</span>';
      }).join('') || '<span class="muted small">Belum ada (PROJECT_SHEET kosong).</span>';
      $('btn-preview').disabled = !d.sheets.length;
      if (!d.sheets.length && APP_MODE !== 'newsheet') {
        flash('Belum ada sheet issue (header baris ' + d.headerRow + ': No.序号 | Machine | Issue Description). ' +
          'Klik “+ Sheet baru” (menu Impor) untuk membuat sheet dengan format manajer.', 'warn');
      }
    });
  }

  // ---------- Ringkasan (beranda) ----------
  var HEAT_WEEKS = 20;
  var DASH_PAGE = 40;

  function openDash() {
    flash('');
    show('dash');
    if (!state.dash || state.dashStale) loadDashboard();
  }

  function loadDashboard() {
    state.dashStale = false;
    return call('getDashboard').then(function (d) {
      var prev = state.dash || {};
      var byDay = {};
      d.rows.forEach(function (r) {
        var dt = parseYmd(r.date);
        r.day = dt ? ymd(dt) : '';
        if (r.day) byDay[r.day] = (byDay[r.day] || 0) + 1;
      });
      state.dash = { rows: d.rows, url: d.url, byDay: byDay, offset: prev.offset || 0, day: prev.day || '',
        mode: prev.mode || 'all', limit: DASH_PAGE };
      setBadge(d.rows.filter(function (r) { return r.need.length; }).length);
      renderDash();
    }).catch(function (e) {
      if (!state.dash) $('records').innerHTML = '';
      if (state.view === 'dash') flash('Gagal memuat ringkasan: ' + cleanErr(e));
    });
  }

  function renderDash() {
    renderHeat();
    renderDateWarn();
    renderStats();
    renderRecords();
  }

  /** [9, 10, 11, 15] -> "9–11, 15" */
  function rowRanges(rows) {
    rows = rows.slice().sort(function (a, b) { return a - b; });
    var out = [], s = rows[0], p = rows[0];
    for (var i = 1; i <= rows.length; i++) {
      if (rows[i] === p + 1) { p = rows[i]; continue; }
      out.push(s === p ? String(s) : s + '–' + p);
      s = p = rows[i];
    }
    return out.join(', ');
  }

  /**
   * Issue yang tanggalnya (J) tidak terbaca, mis. teks "11月1日" tanpa tahun, tidak bisa masuk heatmap &
   * angka. Ditampilkan terang-terangan supaya tidak diam-diam hilang dari hitungan.
   */
  function renderDateWarn() {
    var bad = state.dash.rows.filter(function (r) { return !r.day; });
    if (!bad.length) { $('date-warn').innerHTML = ''; return; }
    var bySheet = {}, sample = '';
    bad.forEach(function (r) {
      (bySheet[r.sheet] = bySheet[r.sheet] || []).push(r.row);
      if (!sample && r.date) sample = r.date;
    });
    var where = Object.keys(bySheet).map(function (s) { return s + ' baris ' + rowRanges(bySheet[s]); }).join('; ');
    $('date-warn').innerHTML = '<div class="alert warn"><b>' + bad.length + ' issue tidak ikut dihitung</b> di heatmap &amp; angka: ' +
      'tanggal (kolom J) ' + (sample ? 'tidak terbaca, mis. “' + esc(sample) + '” (teks, bukan tanggal)' : 'kosong') +
      '. ' + esc(where) + '. Isi J dengan tanggal asli, mis. 2026/11/01.</div>';
  }

  function heatWindow() {
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var monday = addDays(today, -((today.getDay() + 6) % 7));
    var start = addDays(monday, -7 * (HEAT_WEEKS - 1 + state.dash.offset * HEAT_WEEKS));
    return { today: today, start: start, end: addDays(start, 7 * HEAT_WEEKS - 1) };
  }

  /** 20 minggu (kolom) × Senin–Minggu (baris); warna = jumlah issue per hari (1, 2, 3, 4+). */
  function renderHeat() {
    var d = state.dash, w = heatWindow(), tk = ymd(w.today), cells = [];
    for (var i = 0; i < 7 * HEAT_WEEKS; i++) {
      var day = addDays(w.start, i), k = ymd(day), n = d.byDay[k] || 0;
      var label = DAY[day.getDay()] + ', ' + dayMonth(day) + ' ' + day.getFullYear() + ': ' + (n ? n + ' issue' : 'tidak ada issue');
      var cls = 'heat-cell' + (day > w.today ? ' future' : (n ? ' l' + Math.min(n, 4) : '')) +
        (k === tk ? ' today' : '') + (k === d.day ? ' sel' : '');
      cells.push(n
        ? '<button type="button" class="' + cls + '" data-day="' + k + '" title="' + esc(label) + '" aria-label="' + esc(label) + '"></button>'
        : '<span class="' + cls + '" title="' + esc(label) + '"></span>');
    }
    $('heat-grid').innerHTML = cells.join('');
    var sy = w.start.getFullYear(), ey = w.end.getFullYear();
    $('heat-range').textContent = dayMonth(w.start) + (sy !== ey ? ' ' + sy : '') + ' – ' + dayMonth(w.end) + ' ' + ey;
    $('heat-next').disabled = d.offset === 0;
    var first = Object.keys(d.byDay).sort()[0];
    $('heat-prev').disabled = !first || first >= ymd(w.start);
  }

  function statCard(icon, title, num, foot, opts) {
    opts = opts || {};
    return '<div class="stat-card' + (opts.go ? ' go' : '') + '"' + (opts.go ? ' role="button" tabindex="0" data-go="' + opts.go + '"' : '') + '>' +
      '<div class="stat-title">' + icon + esc(title) + '</div>' +
      '<div class="stat-num' + (opts.dim ? ' dim' : '') + '">' + num + '</div>' + (opts.extra || '') +
      '<div class="stat-foot">' + foot + '</div></div>';
  }

  function renderStats() {
    var d = state.dash, rows = d.rows, tk = ymd(heatWindow().today), month = tk.slice(0, 7);
    var nMonth = rows.filter(function (r) { return r.day.slice(0, 7) === month; }).length;
    var days = Object.keys(d.byDay).sort();
    var since = days.length ? parseYmd(days[0]) : null;
    var downs = rows.map(function (r) { return r.downtime; }).filter(function (x) { return typeof x === 'number' && isFinite(x); });
    var avg = downs.length ? Math.round(downs.reduce(function (a, b) { return a + b; }, 0) / downs.length) : null;
    var open = rows.filter(function (r) { return r.need.length; }).length;
    var pct = rows.length ? Math.round((rows.length - open) * 100 / rows.length) : 0;
    $('stat-grid').innerHTML =
      statCard(ICON.cal, 'Bulan ini', nMonth, 'Hari ini: <b>' + (d.byDay[tk] || 0) + '</b> issue') +
      statCard(ICON.stack, 'Total issue', rows.length, since ? 'Sejak <b>' + esc(dayMonth(since) + ' ' + since.getFullYear()) + '</b>' : 'Belum ada data') +
      statCard(ICON.clock, 'Downtime', avg === null ? '–' : avg + '<small>mnt</small>',
        downs.length ? 'rata-rata dari <b>' + downs.length + '</b> issue' : 'Belum ada data', { dim: avg === null }) +
      statCard(ICON.target, 'Kelengkapan', pct + '%', open ? '<b>' + open + '</b> perlu dilengkapi →' : 'Semua lengkap ✓',
        { extra: '<div class="progress"><span style="width:' + pct + '%"></span></div>', go: open ? 'complete' : '' });
  }

  function dashList() {
    var d = state.dash;
    return d.rows.filter(function (r) {
      return (!d.day || r.day === d.day) && (d.mode !== 'open' || r.need.length);
    }).sort(function (a, b) {
      if (a.day !== b.day) return !a.day ? 1 : (!b.day ? -1 : (a.day < b.day ? 1 : -1));
      var ta = minutesOf(a.start), tb = minutesOf(b.start);
      if (ta !== tb) return (tb === null ? -1 : tb) - (ta === null ? -1 : ta);
      return b.row - a.row;
    });
  }

  function renderRecords() {
    var d = state.dash, list = dashList();
    var open = d.rows.filter(function (r) { return r.need.length; }).length;
    $('rec-open-n').textContent = open ? '(' + open + ')' : '';
    each('#rec-mode button', function (b) { b.classList.toggle('on', b.getAttribute('data-mode') === d.mode); });
    var f = $('rec-filter');
    if (d.day) {
      var dt = parseYmd(d.day);
      f.innerHTML = '<span>' + esc(DAY[dt.getDay()] + ', ' + dayMonth(dt) + ' ' + dt.getFullYear()) + ' · ' + (d.byDay[d.day] || 0) + ' issue</span>' +
        '<button type="button" class="link" id="rec-clear">× Semua tanggal</button>';
    }
    f.classList.toggle('hidden', !d.day);
    if (!d.rows.length) {
      $('records').innerHTML = '<div class="card empty-card"><p>Belum ada issue di sheet.</p>' +
        '<button type="button" class="btn primary" data-go="import">Impor laporan WeChat</button></div>';
      return;
    }
    if (!list.length) {
      $('records').innerHTML = '<div class="card center muted">' + (d.mode === 'open' ? 'Tidak ada yang perlu dilengkapi ✓' : 'Tidak ada issue.') + '</div>';
      return;
    }
    var counts = {};
    list.forEach(function (r) { var m = r.day.slice(0, 7); counts[m] = (counts[m] || 0) + 1; });
    var html = [], cur = null;
    list.slice(0, d.limit).forEach(function (r) {
      var m = r.day.slice(0, 7);
      if (m !== cur) {
        cur = m;
        var dt = parseYmd(r.day);
        html.push('<div class="month"><span>' + esc(dt ? MONTHS[dt.getMonth()] + ' ' + dt.getFullYear() : 'Tanpa tanggal') +
          '</span><span class="badge">' + counts[m] + '</span></div>');
      }
      html.push(recRow(r));
    });
    if (list.length > d.limit) {
      html.push('<button type="button" class="btn ghost sm more" id="rec-more">Tampilkan lebih banyak (' + (list.length - d.limit) + ')</button>');
    }
    $('records').innerHTML = html.join('');
  }

  /** Belum lengkap -> buka di Lengkapi; sudah lengkap -> buka barisnya di sheet. */
  function recRow(r) {
    var dt = parseYmd(r.day);
    var when = dt ? DAY[dt.getDay()] + ', ' + dayMonth(dt) : 'Tanpa tanggal';
    var sub = [r.process || plainText(r.machine), plainText(r.problem)].filter(Boolean).join(' · ');
    var inner = '<span class="main"><span class="d">' +
        (r.need.length ? '<span class="dot" title="Perlu dilengkapi: ' + esc(r.need.join(', ')) + '"></span>' : '') + esc(when) + '</span>' +
        '<span class="sub">' + esc(oneLine(sub)) + '</span></span>' +
      '<span class="right"><span class="t">' + esc(r.start || r.end || '–') + '</span>' +
        (r.downtime !== null && r.downtime !== undefined ? '<span class="dt">' + esc(r.downtime) + ' mnt</span>' : '') + '</span>';
    return r.need.length
      ? '<button type="button" class="rrow" data-key="' + esc(r.sheet + '|' + r.row) + '" title="Lengkapi">' + inner + '</button>'
      : '<a class="rrow" href="' + esc(rowUrl(state.dash.url, r)) + '" target="_blank" rel="noopener" title="Buka di sheet">' + inner + '</a>';
  }

  // ---------- 1. Paste ----------
  function doPreview() {
    var btn = $('btn-preview');
    if (btn.disabled) return;
    var text = $('src').value;
    if (!text.trim()) { flash('Paste dulu teks laporan dari WeChat.', 'warn'); $('src').focus(); return; }
    var other = $('other').value;
    flash('');
    busy(btn, true, 'Memproses…');
    call('previewWeChat', text, other, { translate: state.translate }).then(function (p) {
      if (!p.records.length) {
        flash('Tidak ada laporan terdeteksi. Pastikan teks berisi simbol ①–⑨ dari format laporan WeChat.', 'warn');
        return;
      }
      if (p.translateError) {
        flashHtml(esc(p.translateError) + '<div class="alert-actions">' +
          '<button type="button" class="btn ghost sm" id="btn-retry-translate">Coba lagi</button>' +
          '<button type="button" class="btn ghost sm" id="btn-no-translate">Lanjut tanpa terjemahan</button></div>', 'warn');
      }
      state.preview = p;
      state.text = text;
      state.other = other;
      state.sel = {};
      state.disc = {};
      state.edits = {};
      state.editing = {};
      state.reporter = {};
      state.machinePick = {};
      p.records.forEach(function (r) { state.sel[r.id] = r.include; state.disc[r.id] = r.discipline; });
      renderPreview();
      show('preview');
    }).catch(function (e) { flash(cleanErr(e)); })
      .then(function () { busy(btn, false); });
  }

  // ---------- 2. Periksa ----------
  function stat(id, n, label, cls) {
    return '<div class="stat ' + (cls || '') + '"><b' + (id ? ' id="' + id + '"' : '') + '>' + n + '</b><span>' + esc(label) + '</span></div>';
  }

  function renderPreview() {
    var p = state.preview, recs = p.records;
    var count = function (fn) { return recs.filter(fn).length; };
    var nSkip = count(function (r) { return r.skip; });
    var nWarn = count(function (r) { return r.warnings.length; });
    var nDup = count(function (r) { return r.duplicateOf; });
    var dest = p.sheets.map(function (s) {
      return s.error
        ? '<span class="dest bad">' + esc(s.name) + ': ' + esc(s.error) + '</span>'
        : '<span class="dest"><b>' + esc(s.name) + '</b> · mulai baris ' + s.nextRow + '</span>';
    }).join('');
    var lang = p.translated
      ? '<span class="lang on">中文 + (English)</span> terjemahan mesin (Google Translate); teks asli disimpan di catatan sel'
      : '<span class="lang">Bahasa Indonesia</span> tanpa terjemahan';
    $('summary').innerHTML =
      '<div class="sum-head"><div><div class="sum-big">' + recs.length + ' laporan terdeteksi</div>' +
      '<div class="muted small">Urut dari jam kejadian paling awal. Centang yang mau diimpor.</div>' +
      '<div class="small lang-line">' + lang + '</div></div>' +
      '<div class="sum-dest">' + dest + '</div></div>' +
      '<div class="stats">' +
        stat('sel-count', 0, 'akan diimpor', 'primary') +
        stat('', nSkip, 'default dilewati') +
        stat('', nWarn, 'ada peringatan', nWarn ? 'warn' : '') +
        stat('', nDup, 'duplikat', nDup ? 'warn' : '') +
      '</div>';
    renderCards();
  }

  function renderCards() {
    $('rec-list').innerHTML = state.preview.records.map(card).join('');
    updateCounts();
  }

  function recById(id) { return state.preview.records.filter(function (x) { return x.id === id; })[0]; }

  function dupText(d) {
    return d.where === 'sheet' ? 'sudah ada: ' + d.sheet + ' baris ' + d.row : 'duplikat di teks ini';
  }

  function cardTags(r) {
    var tags = [];
    if (r.type) tags.push('<span class="tag ' + (r.skip ? '' : (r.discipline ? 'blue' : 'amber')) + '">' + esc(r.type) + '</span>');
    if (r.skip) tags.push('<span class="tag">default tidak diimpor</span>');
    if (r.duplicateOf) tags.push('<span class="tag amber">' + esc(dupText(r.duplicateOf)) + '</span>');
    if (r.deletedBefore) tags.push('<span class="tag amber">pernah dihapus ' + esc(r.deletedBefore.at) + '</span>');
    if (r.sheetError) tags.push('<span class="tag red">' + esc(r.sheetError) + '</span>');
    else if (!r.writable) tags.push('<span class="tag red">tidak bisa ditulis</span>');
    var nEdit = Object.keys(changed(r)).length + (reporterChanged(r) ? 1 : 0) + (machineChanged(r) ? 1 : 0);
    if (nEdit) tags.push('<span class="tag blue">✎ ' + nEdit + ' diubah</span>');
    tags.push('<span class="tag outline">→ ' + esc(r.sheet) + '</span>');
    return tags.join('');
  }

  function card(r) {
    var on = !!state.sel[r.id], can = selectable(r);
    var editing = !!state.editing[r.id];
    var date = val(r, 'DATE'), end = val(r, 'END_TIME');
    var meta = [
      date ? esc(date) : empty('tanggal ?'),
      r.endDate ? 'selesai ' + esc(r.endDate) : '',
      r.durationText !== '-' ? esc(r.durationText) : ''
    ].filter(Boolean).join(' · ');

    var head =
      '<label class="rec-head">' +
        '<input type="checkbox" data-id="' + r.id + '"' + (on ? ' checked' : '') + (can ? '' : ' disabled') + '>' +
        '<div class="when"><div class="time">' + (r.start ? esc(r.start) : empty('?')) +
          '<span class="arrow">→</span>' + (end ? esc(end) : empty('?')) + '</div>' +
          '<div class="meta">' + meta + '</div></div>' +
        '<div class="tags">' + cardTags(r) + '</div>' +
      '</label>';

    var e1 = val(r, 'ROOT_CAUSE'), f1 = val(r, 'SOLUTION');
    var body = editing ? editForm(r, can) :
      '<div class="rec-body">' +
        previewStrip(r) +
        problemBox(r.description, val(r, 'DESC'), 'Masalah (D)') +
        machineField(r, can) +
        '<div class="field"><div class="k">Discipline (H)</div><div class="v">' + disciplineSelect(r, can) + '</div></div>' +
        picker('pic', splitNames(val(r, 'PIC')), !can) +
        (!r.reporter ? picker('rep', repList(r), !can) : '') +
        (e1 ? biField('Root Cause (E)', e1, '', 'wide') : '') +
        (f1 ? biField('Solution (F)', f1, '', 'wide') : '') +
        biField('Notes (K)', val(r, 'NOTES'), '', 'wide notes-k') +
      '</div>';

    var warns = r.warnings.length
      ? '<ul class="warns">' + r.warnings.map(function (w) {
          return '<li>' + (w.col ? '<span class="col-chip">' + esc(w.col) + '</span>' : '<span class="col-chip note">!</span>') +
            '<span>' + esc(w.msg) + '</span></li>';
        }).join('') + '</ul>'
      : '';
    var editBtns = !can ? '' : editing
      ? '<button type="button" class="btn ghost sm" data-act="cancel-edit">Batalkan perubahan</button>' +
        '<button type="button" class="btn primary sm" data-act="done-edit">✓ Selesai edit</button>'
      : '<button type="button" class="btn ghost sm" data-act="edit">✎ Edit isi sel</button>';
    var foot = '<div class="rec-foot">' + warns +
      '<div class="foot-row"><div class="cells">' + emptyLine(r) + '</div>' +
      '<div class="foot-actions">' + editBtns + '</div></div></div>';

    var cls = 'rec ' + (on ? 'is-on' : 'is-off') + (can ? '' : ' is-blocked');
    return '<article class="' + cls + '" data-id="' + r.id + '">' + head + body + foot + '</article>';
  }

  function field(label, value, cls) {
    return '<div class="field ' + (cls || '') + '"><div class="k">' + esc(label) + '</div><div class="v">' +
      (value ? esc(value) : empty()) + '</div></div>';
  }

  /** "中文\n(English)" ditampilkan dua baris; `original` = teks asli Indonesia (kalau diterjemahkan). */
  function biField(label, value, original, cls) {
    var i = value ? value.indexOf('\n(') : -1;
    var shown = !value ? empty()
      : i === -1 ? esc(value)
      : '<span class="zh">' + esc(value.slice(0, i)) + '</span><span class="en">' + esc(value.slice(i + 1)) + '</span>';
    return '<div class="field ' + (cls || '') + '"><div class="k">' + esc(label) + '</div><div class="v bi">' + shown +
      (original ? '<span class="orig">Asli: ' + esc(original) + '</span>' : '') + '</div></div>';
  }

  /** Deretan kotak info: [label, nilai, kelas]. Yang nilainya kosong tidak ditampilkan. */
  function infoStrip(items) {
    var shown = items.filter(function (i) { return i[1] !== '' && i[1] !== null && i[1] !== undefined; });
    return shown.length ? '<div class="info-strip">' + shown.map(function (i) {
      return '<div class="info ' + (i[2] || '') + '"><span class="lbl">' + esc(i[0]) + '</span><span class="val">' + esc(i[1]) + '</span></div>';
    }).join('') + '</div>' : '';
  }

  /** Masalah: teks Bahasa Indonesia besar; isi sel (terjemahan) kecil di bawahnya. */
  function problemBox(orig, cell, label) {
    var main = orig || cell;
    var tr = orig && cell && cell !== orig ? cell : '';
    return '<div class="field wide"><div class="problem"><div class="lbl">' + esc(label) + '</div>' +
      '<div class="txt">' + (main ? esc(main) : empty()) + '</div>' +
      (tr ? '<div class="tr">' + esc(tr) + '</div>' : '') + '</div></div>';
  }

  /** Downtime di layar Periksa: dihitung ulang kalau jam selesai (G) diedit. */
  function downtimeText(r) {
    if (changed(r).hasOwnProperty('END_TIME')) {
      var d = minutesBetween(r.start, String(val(r, 'END_TIME')).trim().replace('.', ':'));
      return d !== null ? d + ' menit' : '?';
    }
    if (r.duration !== null && r.duration !== undefined) return r.duration + ' menit';
    return r.durationText && r.durationText !== '-' ? r.durationText : '';
  }

  function previewStrip(r) {
    return '<div class="field wide strip-slot">' + infoStrip([
      ['Mulai', r.start],
      ['Selesai', val(r, 'END_TIME')],
      ['Downtime', downtimeText(r), 'accent'],
      ['Lini / proses', r.process],
      ['Pelapor', reporterOf(r)],
      ['Status lini', r.lineStatus],
      ['Penanganan', r.handling],
      ['Level', r.level]
    ]) + '</div>';
  }

  function disciplineSelect(r, can) {
    var cur = state.disc[r.id] || '';
    var opts = ['<option value="">— kosong —</option>'].concat(state.init.disciplines.map(function (d) {
      return '<option value="' + esc(d) + '"' + (d === cur ? ' selected' : '') + '>' + esc(d) + '</option>';
    }));
    var hint = r.discipline ? 'otomatis dari “' + r.type + '”'
      : (r.type ? '“' + r.type + '” belum dipetakan, pilih manual atau biarkan kosong' : 'jenis ⑥-1 kosong');
    return '<select class="disc' + (cur ? '' : ' is-empty') + '" data-id="' + r.id + '"' + (can ? '' : ' disabled') + '>' +
      opts.join('') + '</select><div class="hint">' + esc(hint) + '</div>';
  }

  function picks() {
    return state.preview.records
      .filter(function (r) { return state.sel[r.id] && selectable(r); })
      .map(function (r) {
        var p = { id: r.id, discipline: state.disc[r.id] };
        var c = changed(r);
        if (Object.keys(c).length) p.cells = c;
        if (reporterChanged(r)) p.reporter = reporterOf(r);
        if (machineChanged(r)) p.machine = machineRowOf(r);
        return p;
      });
  }

  // ---------- Daftar Mesin: Machine (C) dipilih dari daftar ----------
  function machineInfo() {
    return state.machineListInfo || (state.init && state.init.machineList) || (state.cmp && state.cmp.machineList) || { managed: false, url: '' };
  }
  function machines() { return (state.init && state.init.machines) || (state.cmp && state.cmp.machines) || []; }
  function machineByRow(row) { return machines().filter(function (m) { return m.row === row; })[0] || null; }
  function machineText(m) { return m.zh + '\n(' + m.en + ')'; }
  /** Sama dengan projectKeys_ (Parser.gs). */
  function projKeys(p) {
    var key = function (s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); };
    return [p].concat(String(p || '').split(/\s+[-\u2013\u2014]\s+/)).map(key).filter(Boolean);
  }
  /** Entri untuk proyek ini: entri umum (kolom Proyek kosong) + entri proyek itu. */
  function machineOptionsFor(project) {
    var pk = projKeys(project);
    return machines().filter(function (m) { return !m.project || pk.indexOf(m.project) !== -1; });
  }
  function machineRowOf(r) { return state.machinePick.hasOwnProperty(r.id) ? state.machinePick[r.id] : (r.machineRow || ''); }
  function machineChanged(r) { return state.machinePick.hasOwnProperty(r.id) && state.machinePick[r.id] !== (r.machineRow || ''); }
  function machineManage(disabled) {
    if (disabled) return '';
    var info = machineInfo();
    return info.url ? '<a class="link small" href="' + esc(info.url) + '" target="_blank" rel="noopener">⚙ Atur daftar ↗</a>'
      : '<button type="button" class="link small mach-manage">⚙ Buat daftar mesin</button>';
  }
  function machineOptionsHtml(opts, cur) {
    return opts.map(function (m) {
      return '<option value="' + m.row + '"' + (m.row === cur ? ' selected' : '') + '>' + esc(m.en + ' · ' + m.zh) + '</option>';
    }).join('');
  }

  /** Periksa: pilih mesin/line dari Daftar Mesin; di bawahnya isi sel C yang akan ditulis. */
  function machineField(r, can) {
    var opts = machineOptionsFor(r.project), cur = machineRowOf(r);
    var sel = opts.length ? '<select class="mach' + (cur ? '' : ' is-empty') + '" data-id="' + r.id + '"' + (can ? '' : ' disabled') + '>' +
      (cur ? '' : '<option value="">— pilih mesin / line —</option>') + machineOptionsHtml(opts, cur) + '</select>' : '';
    var v = val(r, 'MACHINE'), i = v.indexOf('\n(');
    var shown = !v ? empty() : i === -1 ? esc(v)
      : '<span class="zh">' + esc(v.slice(0, i)) + '</span><span class="en">' + esc(v.slice(i + 1)) + '</span>';
    var orig = r.machine && v !== r.machine ? '<span class="orig">Asli: ' + esc(r.machine) + '</span>' : '';
    return '<div class="field machine-slot"><div class="label-row"><span class="k">Machine (C)</span>' + machineManage(!can) + '</div>' +
      sel + '<div class="v bi">' + shown + orig + '</div></div>';
  }

  /** Lengkapi: ganti Machine (C) ke entri Daftar Mesin. */
  function cmpMachineSelect(r) {
    var opts = machineOptionsFor(r.project);
    if (!opts.length) {
      return '<div class="field"><div class="label-row"><span class="k">Mesin / line (C)</span>' + machineManage(false) + '</div>' +
        '<p class="hint">' + (machineInfo().managed ? 'Belum ada mesin untuk proyek ini di Daftar Mesin.' : 'Pilih dari daftar supaya nama mesin seragam.') + '</p></div>';
    }
    var cur = (opts.filter(function (m) { return machineText(m) === r.machine; })[0] || {}).row;
    return '<div class="field"><div class="label-row"><label class="k">Mesin / line (C)</label>' + machineManage(false) + '</div>' +
      '<select class="cmp-input mach-cmp" data-name="machine"><option value="">— tetap seperti sekarang —</option>' +
      machineOptionsHtml(opts, cur) + '</select></div>';
  }

  /** "⚙ Buat daftar mesin": sheet Daftar Mesin dibuat dari nama Machine yang sudah dipakai. */
  function manageMachines(btn) {
    busy(btn, true, 'Menyiapkan…');
    call('openMachineList').then(function (res) {
      state.machineListInfo = { managed: true, url: res.url };
      [state.init, state.cmp].forEach(function (o) { if (o) { o.machines = res.machines; o.machineList = state.machineListInfo; } });
      if (state.preview) renderCards();
      if (state.cmp && state.view === 'complete') { var d = cmpDrafts(); renderComplete(); restoreDrafts(d); }
      toastHtml((res.created ? 'Sheet “Daftar Mesin” dibuat dari ' + res.count + ' nama Machine yang sudah dipakai. ' : '') +
        '<a href="' + esc(res.url) + '" target="_blank" rel="noopener">Buka Daftar Mesin ↗</a> · rapikan di sana (hapus yang salah, ' +
        'perbaiki Mandarinnya), lalu muat ulang halaman ini.');
    }).catch(function (e) {
      busy(btn, false);
      toast('Gagal menyiapkan Daftar Mesin: ' + cleanErr(e), 'err');
    });
  }

  // ---------- Pemilih nama (PIC: boleh banyak; pelapor: satu) ----------
  function reporterOf(r) { return state.reporter.hasOwnProperty(r.id) ? state.reporter[r.id] : (r.reporter || ''); }
  function reporterChanged(r) { return state.reporter.hasOwnProperty(r.id) && state.reporter[r.id] !== (r.reporter || ''); }
  function repList(r) { var n = reporterOf(r); return n ? [n] : []; }

  /** Sheet "Daftar PIC": { managed: ada?, url }. */
  function picInfo() {
    return state.picList || (state.init && state.init.picList) || (state.cmp && state.cmp.picList) || { managed: false, url: '' };
  }

  /**
   * Nama pilihan. Daftar PIC dipakai (sheet ada): nama di sheet itu + yang sedang dipilih + nama baru sesi ini.
   * Belum: nama dari kolom I (paling sering dulu) + nama di teks ini + nama baru sesi ini.
   */
  function nameList(kind, selected) {
    var out = [], seen = {};
    var add = function (n) {
      n = String(n || '').replace(/\s+/g, ' ').trim();
      var k = n.toLowerCase();
      if (n && !seen[k]) { seen[k] = true; out.push(n); }
    };
    var init = state.init || {}, cmp = state.cmp || {};
    var pics = function () {
      (init.roster || []).concat(cmp.roster || []).forEach(function (p) { add(p.name); });
      if (state.preview && !picInfo().managed) state.preview.records.forEach(function (r) { splitNames(r.pic).forEach(add); });
    };
    if (kind === 'rep') {
      (init.reporters || []).forEach(function (p) { add(p.name); });
      if (state.preview) state.preview.records.forEach(function (r) { add(r.reporter); });
    }
    state.extraNames[kind].forEach(add);
    pics();
    (selected || []).forEach(add);
    return out;
  }

  function picker(kind, selected, disabled) {
    var on = {};
    selected.forEach(function (n) { on[n.toLowerCase()] = true; });
    var chips = nameList(kind, selected).map(function (n) {
      var sel = !!on[n.toLowerCase()];
      return '<button type="button" class="pic-chip' + (sel ? ' on' : '') + '" data-name="' + esc(n) + '" aria-pressed="' + sel + '"' +
        (disabled ? ' disabled' : '') + '>' + esc(n) + '</button>';
    }).join('');
    var label = kind === 'pic' ? 'PIC (I)' : 'Pelapor (dicatat di Notes K)';
    var info = kind === 'pic'
      ? (selected.length ? selected.length + ' dipilih · klik nama untuk pilih / batal' : 'belum ada · klik nama untuk memilih')
      : (selected.length ? 'klik lagi untuk batal' : 'tidak terbaca dari chat · pilih');
    var pi = picInfo();
    var manage = kind !== 'pic' || disabled ? ''
      : pi.url ? ' · <a class="link small" href="' + esc(pi.url) + '" target="_blank" rel="noopener">⚙ Atur daftar ↗</a>'
      : ' · <button type="button" class="link small pic-manage">⚙ Atur daftar</button>';
    return '<div class="field wide picker' + (selected.length ? '' : ' is-missing') + '" data-kind="' + kind + '">' +
      '<div class="label-row"><span class="k">' + label + '</span><span class="hint">' + esc(info) + manage + '</span></div>' +
      '<div class="pic-chips">' + (chips || '<span class="muted small">Belum ada nama tersimpan.</span>') + '</div>' +
      (disabled ? '' : '<div class="pic-add"><input type="text" class="pic-new" maxlength="60" placeholder="+ Nama lain" aria-label="Tambah nama">' +
        '<span class="hint">Enter untuk menambah</span></div>') + '</div>';
  }

  function toggleName(list, name, multi) {
    var k = name.toLowerCase();
    var has = list.some(function (n) { return n.toLowerCase() === k; });
    if (!multi) return has ? [] : [name];
    return has ? list.filter(function (n) { return n.toLowerCase() !== k; }) : list.concat(name);
  }

  function addName(kind, name) {
    if (!state.extraNames[kind].some(function (n) { return n.toLowerCase() === name.toLowerCase(); })) state.extraNames[kind].push(name);
  }

  /** Klik nama / Enter di "+ Nama lain". `get(art, kind)` = pilihan sekarang, `set(art, kind, list)` = simpan. */
  function pickerClick(e, get, set) {
    var chip = e.target.closest('.pic-chip');
    if (!chip || chip.disabled) return false;
    var art = chip.closest('.rec'), kind = chip.closest('.picker').getAttribute('data-kind');
    set(art, kind, toggleName(get(art, kind), chip.getAttribute('data-name'), kind === 'pic'));
    return true;
  }
  function pickerEnter(e, get, set, refreshAll) {
    if (e.key !== 'Enter' || !e.target.classList.contains('pic-new')) return false;
    e.preventDefault();
    var name = e.target.value.replace(/\s+/g, ' ').trim();
    if (!name) return true;
    var art = e.target.closest('.rec'), kind = e.target.closest('.picker').getAttribute('data-kind');
    addName(kind, name);
    if (kind === 'pic' && picInfo().managed) {
      call('addPicName', name).then(function (res) {
        if (res.added) toast('“' + res.name + '” ditambahkan ke sheet Daftar PIC.');
      }).catch(function (err) { toast('Nama belum tercatat di Daftar PIC: ' + cleanErr(err), 'err'); });
    }
    var cur = get(art, kind);
    var has = cur.some(function (n) { return n.toLowerCase() === name.toLowerCase(); });
    set(art, kind, has ? cur : (kind === 'pic' ? cur.concat(name) : [name]));
    refreshAll(kind);
    var input = art.querySelector('.picker[data-kind="' + kind + '"] .pic-new');
    if (input) input.focus();
    return true;
  }

  // Periksa
  function previewGet(art, kind) {
    var r = recById(Number(art.getAttribute('data-id')));
    return kind === 'pic' ? splitNames(val(r, 'PIC')) : repList(r);
  }
  function previewSet(art, kind, list) {
    var id = Number(art.getAttribute('data-id'));
    if (kind === 'pic') (state.edits[id] = state.edits[id] || {}).PIC = list.join(', ');
    else state.reporter[id] = list[0] || '';
    refreshCard(art, recById(id));
  }
  function previewRefreshAll(kind) {

  /** Perbarui bagian kartu yang bergantung pada PIC/pelapor tanpa membuang isian lain. */
  function refreshCard(art, r) {
    var can = selectable(r);
    swap(art.querySelector('.picker[data-kind="pic"]'), picker('pic', splitNames(val(r, 'PIC')), !can));
    swap(art.querySelector('.picker[data-kind="rep"]'), picker('rep', repList(r), !can));

  // ---------- Edit isi sel sebelum impor (Edit.gs) ----------
  var TIME_RE = /^(\d{1,2})\s*[:.]\s*(\d{2})$/;
  var DATE_RE = /^(\d{4})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})$/;

  /** Isi sel hasil parser (yang akan ditulis kalau tidak diedit). K sudah termasuk pelapor terpilih. */
  function defaults(r) {
    var m = machineChanged(r) ? machineByRow(machineRowOf(r)) : null;
    return { MACHINE: m ? machineText(m) : (r.cells.C || ''), DESC: r.cells.D || '', ROOT_CAUSE: '', SOLUTION: '',
      END_TIME: r.end || '', PIC: r.pic || '', DATE: r.date || '', NOTES: withReporter(r.cells.K || '', reporterOf(r)) };
  }
  function val(r, k) {
    var e = state.edits[r.id];
    return e && e.hasOwnProperty(k) ? e[k] : defaults(r)[k];
  }
  /** Hanya kolom yang benar-benar berbeda dari hasil parser. */
  function changed(r) {
    var e = state.edits[r.id] || {}, d = defaults(r), out = {};
    Object.keys(e).forEach(function (k) { if (e[k] !== d[k]) out[k] = e[k]; });
    return out;
  }
  function invalidEdit(k, v) {
    v = String(v || '').trim();
    if (!v || (k !== 'END_TIME' && k !== 'DATE')) return false;
    if (k === 'END_TIME') { var t = TIME_RE.exec(v); return !t || +t[1] > 23 || +t[2] > 59; }
    var d = DATE_RE.exec(v);
    if (!d) return true;
    var dt = new Date(Date.UTC(+d[1], +d[2] - 1, +d[3]));
    return dt.getUTCMonth() !== +d[2] - 1 || dt.getUTCDate() !== +d[3];
  }
  function hasInvalid(r) {
    var c = changed(r);
    return ['END_TIME', 'DATE'].some(function (k) { return c.hasOwnProperty(k) && invalidEdit(k, c[k]); });
  }
  function emptyLine(r) {
    var list = emptyNow(r);
    return 'Perlu dilengkapi manual: ' + (list.length ? colChips(list) : '<span class="ok-text">tidak ada ✓</span>');
  }
  function emptyNow(r) {
    return [['ROOT_CAUSE', 'E'], ['SOLUTION', 'F'], ['MACHINE', 'C'], ['DESC', 'D'], ['END_TIME', 'G'],
      ['DISCIPLINE', 'H'], ['PIC', 'I'], ['DATE', 'J']].filter(function (p) {
      var v = p[0] === 'DISCIPLINE' ? state.disc[r.id] : val(r, p[0]);
      return !String(v || '').trim();
    }).map(function (p) { return { key: p[0], col: p[1] }; });
  }

  function editText(r, k, label, rows, orig) {
    var tr = state.preview.translated
      ? '<button type="button" class="link small" data-act="tr" data-key="' + k + '">↻ Terjemahkan</button>' : '';
    return '<div class="field"><div class="label-row"><label class="k" for="ed-' + r.id + '-' + k + '">' + esc(label) + '</label>' + tr + '</div>' +
      '<textarea id="ed-' + r.id + '-' + k + '" data-edit="' + k + '" rows="' + rows + '">' + esc(val(r, k)) + '</textarea>' +
      (orig ? '<p class="hint">Asli: ' + esc(orig) + '</p>' : '') + '</div>';
  }
  function editInput(r, k, label, ph) {
    var v = val(r, k), bad = invalidEdit(k, v);
    return '<div class="field"><label class="k" for="ed-' + r.id + '-' + k + '">' + esc(label) + '</label>' +
      '<input type="text" id="ed-' + r.id + '-' + k + '" data-edit="' + k + '" value="' + esc(v) + '" placeholder="' + esc(ph) + '"' +
      (bad ? ' class="invalid"' : '') + '>' +
      '<p class="hint err-text' + (bad ? '' : ' hidden') + '" data-err="' + k + '">Format: ' +
        (k === 'DATE' ? 'tahun/bulan/tanggal, mis. 2026/10/20' : 'jam:menit, mis. 20:30') + '</p></div>';
  }
  function editForm(r, can) {
    return '<div class="rec-body edit-form">' +
      previewStrip(r) +
      machineField(r, can) +
      editText(r, 'MACHINE', 'Machine (C), teks manual', 2, r.machine) +
      editText(r, 'DESC', 'Deskripsi (D)', 3, r.description) +
      editText(r, 'ROOT_CAUSE', 'Root Cause (E)', 3) +
      editText(r, 'SOLUTION', 'Solution (F)', 3) +
      '<div class="wide edit-row">' +
        editInput(r, 'END_TIME', 'End Time (G)', 'mis. 20:30') +
        '<div class="field"><div class="k">Discipline (H)</div>' + disciplineSelect(r, can) + '</div>' +
        editInput(r, 'DATE', 'Date (J)', 'mis. 2026/10/20') +
      '</div>' +
      picker('pic', splitNames(val(r, 'PIC')), !can) +
      picker('rep', repList(r), !can) +
      '<div class="wide">' + editText(r, 'NOTES', 'Notes (K)', 2) + '</div>' +
      '<p class="hint wide">' + (state.preview.translated
        ? 'Teks tanpa huruf Mandarin dianggap Bahasa Indonesia dan diterjemahkan saat impor; klik ↻ untuk melihat hasilnya sekarang. Teks berhuruf Mandarin ditulis apa adanya.'
        : 'Tanpa terjemahan: isi ditulis apa adanya.') + '</p>' +

  }

  function rerenderCard(id) {
    var r = recById(id);
    var art = document.querySelector('#rec-list .rec[data-id="' + id + '"]');
    if (!r || !art) return null;

  function translateField(art, key, btn) {
    var id = Number(art.getAttribute('data-id'));
    var ta = art.querySelector('[data-edit="' + key + '"]');

      updateCounts();

  function updateCounts() {
    var n = picks().length, total = state.preview.records.length;
    var blocked = !!state.preview.translateError; // impor dengan terjemahan pasti gagal lagi
    var invalid = state.preview.records.some(function (r) { return state.sel[r.id] && hasInvalid(r); });
    if ($('sel-count')) $('sel-count').textContent = n;
    $('act-note').textContent = n + ' dari ' + total + ' laporan dipilih';
    var btn = $('btn-import');
    if (!btn.classList.contains('is-busy')) {
      btn.textContent = blocked ? 'Terjemahan gagal' : invalid ? 'Ada jam/tanggal tidak valid'
        : (n ? 'Impor ' + n + ' laporan' : 'Belum ada yang dipilih');
      btn.disabled = !n || blocked || invalid;
    }
  }

  function setAll(on) {
    state.preview.records.forEach(function (r) { if (selectable(r)) state.sel[r.id] = on; });
    renderCards();

  // Satu proses Apps Script maksimal 6 menit: paste besar ditulis bertahap per IMPORT_BATCH laporan.
  var IMPORT_BATCH = 15;

  function doImport() {
    var list = picks();
    if (!list.length) return;
    var btn = $('btn-import');
    var total = { written: [], errors: [], url: '' };
    var batches = [];
    for (var i = 0; i < list.length; i += IMPORT_BATCH) batches.push(list.slice(i, i + IMPORT_BATCH));
    busy(btn, true, 'Menulis ke sheet…');
    $('btn-back').disabled = true;
    var finish = function () {
      flash('');
      loadDashboard(); // angka Lengkapi + Ringkasan
      renderResult(total);
      show('result');
    };
    var next = function (k) {
      if (k === batches.length) return Promise.resolve(finish());
      if (batches.length > 1) btn.textContent = 'Menulis ' + Math.min((k + 1) * IMPORT_BATCH, list.length) + ' / ' + list.length + '…';
      return call('importWeChat', state.text, state.other, batches[k], { translate: state.translate }).then(function (res) {
        total.written = total.written.concat(res.written);
        total.errors = total.errors.concat(res.errors);
        total.url = res.url;
        return next(k + 1);
      }).catch(function (e) {
        if (!total.written.length) { flash('Gagal menulis: ' + cleanErr(e)); return; }
        // Sebagian sudah tertulis: tampilkan yang berhasil + sisa yang belum ditulis.
        var left = list.length - k * IMPORT_BATCH;
        total.errors.push('Berhenti: ' + cleanErr(e) + ' ' + left + ' laporan berikutnya belum ditulis; ' +
          'paste ulang teks yang sama, yang sudah masuk akan ditandai duplikat.');
        finish();
      });
    };
    next(0).then(function () { busy(btn, false); $('btn-back').disabled = false; updateCounts(); });
  }

  // ---------- 3. Selesai ----------
  function rowUrl(url, x) { return url.replace(/#.*$/, '') + '#gid=' + x.sheetId + '&range=B' + x.row; }

  function rowsText(rows) {
    rows = rows.slice().sort(function (a, b) { return a - b; });
    var contiguous = rows.every(function (r, i) { return i === 0 || r === rows[i - 1] + 1; });
    return contiguous && rows.length > 1 ? rows[0] + '–' + rows[rows.length - 1] : rows.join(', ');
  }

  function renderResult(res) {
    var w = res.written;
    var bySheet = {};
    w.forEach(function (x) { (bySheet[x.sheet] = bySheet[x.sheet] || []).push(x.row); });
    var where = Object.keys(bySheet).map(function (s) { return s + ' baris ' + rowsText(bySheet[s]); }).join('; ');

    var hero = '<div class="card hero' + (w.length ? '' : ' empty-result') + '">' +
      '<div class="hero-icon">' + (w.length ? '✓' : '!') + '</div>' +
      '<div class="grow"><h1>' + (w.length ? w.length + ' laporan ditulis' : 'Tidak ada yang ditulis') + '</h1>' +
      '<p class="muted">' + (w.length ? esc(where) + '. Kirim teks chat di bawah ke teknisi untuk melengkapi yang kosong.' : 'Lihat pesan di bawah.') + '</p></div>' +
      '<a class="btn ghost" href="' + esc(res.url) + '" target="_blank" rel="noopener">Buka spreadsheet ↗</a></div>';

    var errors = res.errors.length
      ? '<div class="alert err"><b>Tidak ditulis:</b><ul>' + res.errors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>'
      : '';

    state.result = res;
    state.written = w;
    var live = w.filter(function (x) { return !x.deleted; });
    var chat = live.length ? '<div class="card"><div class="card-row"><h2>Teks chat untuk teknisi</h2>' +
      '<button type="button" class="btn primary sm" id="btn-copy">Salin</button></div>' +
      '<div class="muted small">Ringkas: masalah, jam, PIC, pelapor, lalu baris ✏️ yang tinggal diisi. Boleh diedit sebelum disalin.</div>' +
      '<textarea id="mentor-text" class="chat-text" spellcheck="false">' + esc(chatText(live.map(writtenChat))) + '</textarea></div>' : '';

    var table = w.length ? '<div class="card"><h2>Baris yang ditulis</h2><div class="table-wrap"><table>' +
      '<thead><tr><th>No.</th><th>Sheet · baris</th><th>Waktu</th><th>Machine · Deskripsi</th><th>Perlu dilengkapi</th><th></th></tr></thead><tbody>' +
      w.map(function (x, i) {
        return '<tr' + (x.deleted ? ' class="is-deleted"' : '') + '><td class="num">' + esc(x.no) + '</td>' +
          '<td class="nowrap">' + (x.deleted ? esc(x.sheet) + ' · dihapus'
            : '<a href="' + esc(rowUrl(res.url, x)) + '" target="_blank" rel="noopener">' + esc(x.sheet) + ' · ' + x.row + ' ↗</a>') + '</td>' +
          '<td class="nowrap">' + esc([x.date, x.start].filter(Boolean).join(' ')) + '</td>' +
          '<td>' + (x.machine ? esc(x.machine) : empty()) + '<div class="muted small clamp">' + esc(x.description) + '</div></td>' +
          '<td><div class="chips">' + (x.deleted ? '' : colChips(x.empty)) + '</div></td>' +
          '<td>' + (x.deleted ? '' : '<button type="button" class="btn ghost sm danger res-del" data-i="' + i + '" title="Hapus baris ini dari sheet">Hapus</button>') + '</td></tr>';
      }).join('') + '</tbody></table></div><p class="hint">Salah masuk (mis. laporan yang tidak seharusnya di-upload)? Klik Hapus dua kali.</p></div>' : '';

    var actions = '<div class="end-actions">' +
      (w.length ? '<button type="button" class="btn ghost" id="btn-to-complete">Lengkapi Root Cause / Solution →</button>' : '') +
      (APP_MODE === 'dialog' ? '<button type="button" class="btn ghost" id="btn-close">Tutup</button>' : '') +
      '<button type="button" class="btn primary" id="btn-again">Paste laporan berikutnya</button></div>';

    $('view-result').innerHTML = hero + errors + chat + table + actions;
  }

  // ---------- Teks chat untuk teknisi ----------
  /** item = { title, problem, date, start, end, downtime, pic, reporter, ask: [label kolom kosong] } */
  function chatText(items) {
    items = items.filter(function (it) { return it.ask.length; });
    if (!items.length) return 'Semua laporan sudah lengkap, tidak ada yang perlu ditanyakan ✓';
    var out = ['🔧 Mohon dilengkapi (' + items.length + ' laporan)', 'Isi baris ✏️ lalu kirim balik ya 🙏', ''];
    items.forEach(function (it, i) {
      out.push((i + 1) + ') ' + (oneLine(it.title) || '-'));
      if (it.problem) out.push('❗ ' + oneLine(it.problem));
      var dt = parseYmd(it.date);
      var time = it.start || it.end ? (it.start || '?') + ' → ' + (it.end || '?') : '';
      var dur = it.downtime !== null && it.downtime !== undefined && it.downtime !== '' ? '(' + it.downtime + ' menit)' : '';
      var when = [dt ? dayMonth(dt) : '', time].filter(Boolean).join(' · ');
      if (when || dur) out.push('⏱ ' + [when, dur].filter(Boolean).join(' '));
      if (it.pic) out.push('👷 PIC: ' + it.pic);
      if (it.reporter) out.push('📝 Pelapor: ' + it.reporter);
      it.ask.forEach(function (a) { out.push('✏️ ' + a + ': '); });
      out.push('');
    });
    return out.join('\n').replace(/\s+$/, '');
  }

  function writtenChat(x) {
    var d = minutesBetween(x.start, x.end);
    return { title: x.machine, problem: x.description, date: x.date, start: x.start, end: x.end,
      downtime: d !== null ? d : x.duration, pic: x.pic, reporter: x.reporter,
      ask: x.empty.map(function (y) { return ASK[y.key]; }).filter(Boolean) };
  }

  /** Baris Lengkapi: yang ditanyakan hanya yang benar-benar kosong (teks Indonesia yang belum diterjemahkan tidak). */
  function cmpChat(r) {
    var pic = cmpPicVal(r), ask = [];
    if (isEmptyStr(r.rootCause)) ask.push(ASK.ROOT_CAUSE);
    if (isEmptyStr(r.solution)) ask.push(ASK.SOLUTION);
    if (isEmptyStr(r.discipline)) ask.push(ASK.DISCIPLINE);
    if (isEmptyStr(pic)) ask.push(ASK.PIC);
    if (isEmptyStr(r.end)) ask.push(ASK.END_TIME);
    return { title: plainText(r.machineOrig || r.machine), problem: plainText(r.descOrig || r.description), date: r.date,
      start: r.start, end: r.end, downtime: r.downtime, pic: pic, reporter: r.reporter, ask: ask };
  }

  function showCmpChat(rows, note) {
    $('cmp-chat-text').value = chatText(rows.map(cmpChat));
    $('cmp-chat-note').textContent = note;
    $('cmp-chat').classList.remove('hidden');
    $('cmp-chat').scrollIntoView({ block: 'start' });
    window.scrollBy(0, -80);

  function copyText(ta, btn) {
    var label = btn.textContent;
    var done = function () {
      btn.textContent = 'Tersalin ✓';
      setTimeout(function () { btn.textContent = label; }, 1600);
    };
    var fallback = function () {
      ta.focus();
      ta.select();
      try { if (document.execCommand('copy')) { done(); return; } } catch (e) { /* lanjut ke pesan */ }
      flash('Browser menolak menyalin otomatis. Teks sudah dipilih: tekan Ctrl+C.', 'warn');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, fallback);
    else fallback();
  }

        roster: d.roster || [], filter: prev.filter || '', date: prev.date || '' };

  function focusCmp(key) {

  function cmpRows() {
    var c = state.cmp;

  }

  function cmpTitle() {
    var c = state.cmp;
    var open = c.rows.filter(function (r) { return r.need.length; }).length;
    var t = open ? open + ' baris perlu dilengkapi' : 'Semua baris sudah lengkap';
    if (c.total > c.rows.length) t += ' (menampilkan ' + c.rows.length + ' terbaru dari ' + c.total + ')';

  function renderComplete() {
    var c = state.cmp;
    cmpTitle();
    var counts = {};
    c.rows.forEach(function (r) { counts[r.sheet] = (counts[r.sheet] || 0) + 1; });
    $('cmp-sheet').innerHTML = '<option value="">Semua sheet</option>' + c.sheets.map(function (n) {
      return '<option value="' + esc(n) + '"' + (n === c.filter ? ' selected' : '') + '>' + esc(n) + ' (' + (counts[n] || 0) + ')</option>';
    }).join('');
    var dates = {};
    c.rows.forEach(function (r) { if (!c.filter || r.sheet === c.filter) dates[r.date || ''] = (dates[r.date || ''] || 0) + 1; });
    if (c.date && !dates[c.date]) c.date = '';
    $('cmp-date').innerHTML = '<option value="">Semua tanggal</option>' + Object.keys(dates).filter(Boolean).sort().reverse().map(function (d) {
      var dt = parseYmd(d);
      return '<option value="' + esc(d) + '"' + (d === c.date ? ' selected' : '') + '>' +
        esc(dt ? DAY[dt.getDay()] + ', ' + dayMonth(dt) + ' ' + dt.getFullYear() : d) + ' (' + dates[d] + ')</option>';
    }).join('');
    var rows = cmpRows();
    $('cmp-chat-btn').textContent = '💬 Teks chat (' + rows.filter(function (r) { return cmpChat(r).ask.length; }).length + ')';
    $('cmp-list').innerHTML = rows.length ? rows.map(cmpCard).join('')
      : '<div class="card center muted">Tidak ada baris yang perlu dilengkapi' + (c.filter || c.date ? ' untuk filter ini' : '') + '.</div>';
  }

  function cmpKey(r) { return r.sheet + '|' + r.row; }
  function cmpByKey(key) { return state.cmp.rows.filter(function (x) { return cmpKey(x) === key; })[0]; }
  function cmpPicVal(r) { var k = cmpKey(r); return state.cmpPic.hasOwnProperty(k) ? state.cmpPic[k] : (r.pic || ''); }

  function cmpText(label, name, value, r) {
    if (hasChinese(value)) return biField(label, value, '');
    return '<div class="field"><label class="k" for="' + name + '-' + r.row + '-' + esc(r.sheetId) + '">' + esc(label) + '</label>' +
      '<textarea class="cmp-input" data-name="' + name + '" id="' + name + '-' + r.row + '-' + esc(r.sheetId) + '" rows="3" ' +
      'placeholder="Tulis dalam Bahasa Indonesia…">' + esc(value) + '</textarea>' +
      (value ? '<p class="hint">Belum diterjemahkan. Simpan untuk menerjemahkan.</p>' : '') + '</div>';
  }

  function cmpCard(r) {
    var done = !r.need.length;
    var head =
      '<div class="rec-head static">' +
        '<div class="when"><div class="time">No. ' + esc(r.no || '–') + '<span class="arrow">·</span>' + (r.date ? esc(r.date) : empty('tanggal ?')) + '</div>' +
          '<div class="meta">' + esc(r.sheet) + ' · baris ' + r.row + '</div></div>' +
        '<div class="tags">' + (done ? '<span class="tag green">✓ Lengkap</span>'
          : '<span class="tag">Perlu: ' + r.need.map(function (n) { return n.col; }).join(', ') + '</span>') +
          '<a class="tag outline" href="' + esc(rowUrl(state.cmp.url, r)) + '" target="_blank" rel="noopener">Buka di sheet ↗</a></div>' +
      '</div>';
    var calc = minutesBetween(r.start, r.end);
    var down = r.downtime !== null && r.downtime !== undefined
      ? r.downtime + ' menit' + (r.downtimeUnverified ? ' (belum diverifikasi)' : '')
      : (calc !== null ? calc + ' menit' : '');
    var strip = infoStrip([['Mulai', r.start], ['Selesai', r.end], ['Downtime', down, 'accent'],
      ['Lini / proses', r.process], ['Pelapor', r.reporter], ['Status lini', r.lineStatus], ['Penanganan', r.handling]]);
    var body = '<div class="rec-body">' + (strip ? '<div class="field wide">' + strip + '</div>' : '') +
      problemBox(r.descOrig, r.description, 'Masalah (D)') +
      biField('Machine (C)', r.machine, r.machineOrig) + (done ? field('PIC (I)', r.pic) : '') + '</div>';
    var disc = isEmptyStr(r.discipline)
      ? '<div class="field"><label class="k">Discipline (H)</label><select class="cmp-input disc is-empty" data-name="discipline">' +
        '<option value="">— kosong —</option>' + state.cmp.disciplines.map(function (d) {
          return '<option value="' + esc(d) + '">' + esc(d) + '</option>';
        }).join('') + '</select></div>'
      : field('Discipline (H)', r.discipline);
    var form = done ? '' : '<div class="rec-body cmp-form">' +
      cmpText('Root Cause (E)', 'rootCause', r.rootCause, r) + cmpText('Solution (F)', 'solution', r.solution, r) +
      cmpMachineSelect(r) + disc +
      picker('pic', splitNames(cmpPicVal(r)), false) + '</div>';
    var foot = done ? '' : '<div class="rec-foot cmp-actions">' +
      '<button type="button" class="btn ghost sm danger cmp-del" title="Hapus baris ini dari sheet">Hapus</button>' +
      '<span class="cmp-status small"></span>' +
      '<button type="button" class="btn ghost sm cmp-chat1">💬 Chat</button>' +
      '<button type="button" class="btn primary sm cmp-save">' + (state.cmp.translate ? 'Simpan &amp; terjemahkan' : 'Simpan') + '</button></div>';
    return '<article class="rec cmp ' + (done ? 'is-done' : 'is-on') + '" data-key="' + esc(cmpKey(r)) + '">' + head + body + form + foot + '</article>';
  }

  function cmpGet(art) { return splitNames(cmpPicVal(cmpByKey(art.getAttribute('data-key'))) ); }
  function cmpSet(art, kind, list) {
    state.cmpPic[art.getAttribute('data-key')] = list.join(', ');
    swap(art.querySelector('.picker[data-kind="pic"]'), picker('pic', list, false));
    var st = art.querySelector('.cmp-status');
    if (st && !st.classList.contains('muted')) st.textContent = '';
  }
  function cmpRefreshAll() {
    each('#cmp-list .rec', function (art) {
      var r = cmpByKey(art.getAttribute('data-key'));
      swap(art.querySelector('.picker[data-kind="pic"]'), picker('pic', splitNames(cmpPicVal(r)), false));
    });
  }

  function saveCard(art) {
    var r = cmpByKey(art.getAttribute('data-key'));
    var btn = art.querySelector('.cmp-save');
    var status = art.querySelector('.cmp-status');
    if (!r || !btn || btn.disabled) return;
    var item = { sheet: r.sheet, row: r.row,
      expect: { machine: r.machine, description: r.description, rootCause: r.rootCause, solution: r.solution, discipline: r.discipline } };
    Array.prototype.forEach.call(art.querySelectorAll('.cmp-input'), function (el) { item[el.getAttribute('data-name')] = el.value; });
    var pic = cmpPicVal(r);
    if (pic !== (r.pic || '')) { item.pic = pic; item.expect.pic = r.pic; }
    var mm = item.machine ? machineByRow(Number(item.machine)) : null;
    if (!mm || machineText(mm) === r.machine) delete item.machine;
    if (isEmptyStr(item.rootCause) && isEmptyStr(item.solution) && !item.discipline && item.pic === undefined && !item.machine) {
      status.className = 'cmp-status small warn-text';
      status.textContent = 'Isi Root Cause, Solution, Discipline, atau ubah PIC / mesin dulu.';
      return;
    }
    status.className = 'cmp-status small muted';
    status.textContent = state.cmp.translate ? 'Menerjemahkan & menyimpan…' : 'Menyimpan…';
    busy(btn, true, 'Menyimpan…');
    call('saveCompletion', item).then(function (r2) {
      var key = cmpKey(r2);
      delete state.cmpPic[key];
      state.cmp.rows = state.cmp.rows.map(function (x) { return cmpKey(x) === key ? r2 : x; });
      state.cmp.total = Math.max(0, state.cmp.total - (r2.need.length ? 0 : 1));
      state.dashStale = true;
      setBadge(state.cmp.total);
      var fresh = swap(art, cmpCard(r2));
      var st = fresh && fresh.querySelector('.cmp-status');
      if (st) { st.className = 'cmp-status small ok-text'; st.textContent = '✓ Tersimpan. Masih perlu: ' + r2.need.map(function (n) { return n.col; }).join(', '); }
      cmpTitle();
    }).catch(function (e) {
      busy(btn, false);
      status.className = 'cmp-status small err-text';
      status.textContent = cleanErr(e);
    });
  }

  // ---------- Hapus baris (laporan yang tidak seharusnya masuk) ----------
  /** Dua langkah: klik pertama minta konfirmasi selama 4 detik, klik kedua baru menghapus. */
  function armDelete(btn) {
    if (btn.classList.contains('armed')) return true;
    btn.classList.add('armed');
    btn.textContent = 'Yakin? Klik lagi';
    setTimeout(function () {
      if (btn.classList.contains('armed') && !btn.classList.contains('is-busy')) { btn.classList.remove('armed'); btn.textContent = 'Hapus'; }
    }, 4000);
    return false;
  }

  /** target = { sheet, row, machine, description }: isi C/D yang terlihat di layar (dicek ulang di server). */
  function doDelete(btn, target) {
    if (!armDelete(btn)) return;
    busy(btn, true, 'Menghapus…');
    call('deleteIssueRow', { sheet: target.sheet, row: target.row, expect: { machine: target.machine, description: target.description } })
      .then(function (res) {
        afterDelete(res);
        toast('Baris ' + res.row + (res.no ? ' (No. ' + res.no + ')' : '') + ' dihapus dari “' + res.sheet + '”. ' +
          'Salinannya di sheet tersembunyi ' + res.log + '; kalau di-paste lagi, laporan ini tidak dicentang.');
      }).catch(function (e) {
        busy(btn, false);
        btn.classList.remove('armed');
        btn.textContent = 'Hapus';
        toast('Gagal menghapus: ' + cleanErr(e), 'err');
      });
  }

  function cmpDrafts() {
    var out = {};
    each('#cmp-list .rec', function (art) {
      var x = {};
      Array.prototype.forEach.call(art.querySelectorAll('.cmp-input'), function (el) { x[el.getAttribute('data-name')] = el.value; });
      out[art.getAttribute('data-key')] = x;
    });
    return out;
  }
  function restoreDrafts(drafts) {
    each('#cmp-list .rec', function (art) {
      var x = drafts[art.getAttribute('data-key')];
      if (!x) return;
      Array.prototype.forEach.call(art.querySelectorAll('.cmp-input'), function (el) {
        var n = el.getAttribute('data-name');
        if (!x.hasOwnProperty(n)) return;
        el.value = x[n];
        if (el.tagName === 'SELECT') el.classList.toggle('is-empty', !el.value);
      });
    });
  }

  /** Baris di bawah yang dihapus naik satu: perbarui daftar Lengkapi (isian yang belum disimpan tetap) & layar Selesai. */
  function afterDelete(res) {
    var key = res.sheet + '|' + res.row;
    var below = function (x) { return x.sheet === res.sheet && x.row > res.row; };
    var rekey = function (k) {
      var i = k.lastIndexOf('|'), r = Number(k.slice(i + 1));
      return k.slice(0, i) === res.sheet && r > res.row ? res.sheet + '|' + (r - 1) : k;
    };
    if (state.cmp) {
      var old = cmpDrafts(), drafts = {}, pics = {};
      Object.keys(old).forEach(function (k) { if (k !== key) drafts[rekey(k)] = old[k]; });
      Object.keys(state.cmpPic).forEach(function (k) { if (k !== key) pics[rekey(k)] = state.cmpPic[k]; });
      state.cmpPic = pics;
      var gone = cmpByKey(key);
      state.cmp.rows = state.cmp.rows.filter(function (x) { return cmpKey(x) !== key; });
      state.cmp.rows.forEach(function (x) { if (below(x)) x.row -= 1; });
      if (gone && gone.need.length) state.cmp.total = Math.max(0, state.cmp.total - 1);
      setBadge(state.cmp.total);
      if (state.view === 'complete') { renderComplete(); restoreDrafts(drafts); }
    }
    var hit = false;
    state.written.forEach(function (x) {
      if (x.deleted || x.sheet !== res.sheet) return;
      if (!hit && x.row === res.row) { x.deleted = true; hit = true; }
      else if (x.row > res.row) x.row -= 1;
    });
    if (state.view === 'result' && state.result) renderResult(state.result);
    loadDashboard(); // angka Lengkapi + Ringkasan
  }

  /** "⚙ Atur daftar": buat sheet Daftar PIC (berisi nama yang sekarang dipakai) lalu tawarkan tautannya. */
  function managePics(btn) {
    busy(btn, true, 'Menyiapkan…');
    call('openPicList').then(function (res) {
      state.picList = { managed: true, url: res.url };
      if (state.init) state.init.picList = state.picList;
      if (state.cmp) state.cmp.picList = state.picList;
      if (state.preview) previewRefreshAll('pic');
      if (state.cmp) cmpRefreshAll();
      toastHtml((res.created ? 'Sheet “Daftar PIC” dibuat dengan ' + res.count + ' nama yang sekarang dipakai. ' : '') +
        '<a href="' + esc(res.url) + '" target="_blank" rel="noopener">Buka Daftar PIC ↗</a> · hapus / tambah baris di sana, lalu muat ulang halaman ini.');
    }).catch(function (e) {
      busy(btn, false);
      toast('Gagal menyiapkan Daftar PIC: ' + cleanErr(e), 'err');
    });
  }

  // ---------- event ----------
  document.addEventListener('click', function (e) {
    var b = e.target.closest('.pic-manage');
    if (b && !b.disabled) managePics(b);
    var m = e.target.closest('.mach-manage');
    if (m && !m.disabled) manageMachines(m);
  });
  // Semua elemen ber-data-go (tombol header, kartu angka, tombol kosong) -> pindah layar.
  document.addEventListener('click', function (e) {
    var g = e.target.closest('[data-go]');
    if (g && !g.disabled) go(g.getAttribute('data-go'));
  });
  $('stat-grid').addEventListener('keydown', function (e) {
    var g = e.target.closest('[data-go]');
    if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); go(g.getAttribute('data-go')); }
  });

  // Ringkasan
  $('heat-grid').addEventListener('click', function (e) {
    var c = e.target.closest('[data-day]');
    if (!c) return;
    var d = state.dash, k = c.getAttribute('data-day');
    d.day = d.day === k ? '' : k;
    d.limit = DASH_PAGE;
    renderHeat();
    renderRecords();
  });
  $('heat-prev').addEventListener('click', function () { state.dash.offset++; renderHeat(); });
  $('heat-next').addEventListener('click', function () { if (state.dash.offset) { state.dash.offset--; renderHeat(); } });
  $('rec-mode').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-mode]');
    if (!b || !state.dash) return;
    state.dash.mode = b.getAttribute('data-mode');
    state.dash.limit = DASH_PAGE;
    renderRecords();
  });
  $('rec-filter').addEventListener('click', function (e) {
    if (e.target.id !== 'rec-clear') return;
    state.dash.day = '';
    renderHeat();
    renderRecords();
  });
  $('records').addEventListener('click', function (e) {
    if (e.target.id === 'rec-more') { state.dash.limit += DASH_PAGE; renderRecords(); return; }
    var row = e.target.closest('button.rrow[data-key]');
    if (row) openComplete(row.getAttribute('data-key'));
  });

  // Lengkapi
  $('cmp-reload').addEventListener('click', openComplete);
  $('cmp-sheet').addEventListener('change', function () { state.cmp.filter = this.value; renderComplete(); });
  $('cmp-date').addEventListener('change', function () { state.cmp.date = this.value; renderComplete(); });
  $('cmp-chat-btn').addEventListener('click', function () {
    if (!state.cmp) return;
    var c = state.cmp, rows = cmpRows();
    var f = [c.filter ? 'sheet ' + c.filter : '', c.date ? 'tanggal ' + c.date : ''].filter(Boolean).join(', ');
    showCmpChat(rows, 'Dari ' + rows.length + ' baris di daftar' + (f ? ' (' + f + ')' : '') + '. Pilih sheet/tanggal untuk mempersempit.');
  });
  $('cmp-chat-close').addEventListener('click', function () { $('cmp-chat').classList.add('hidden'); });
  $('cmp-chat-copy').addEventListener('click', function () { copyText($('cmp-chat-text'), this); });
  $('cmp-list').addEventListener('click', function (e) {
    if (pickerClick(e, cmpGet, cmpSet)) return;
    var art = e.target.closest('.rec');
    if (e.target.classList.contains('cmp-save')) saveCard(art);
    else if (e.target.classList.contains('cmp-del')) doDelete(e.target, cmpByKey(art.getAttribute('data-key')));
    else if (e.target.classList.contains('cmp-chat1')) {
      var r = cmpByKey(art.getAttribute('data-key'));
      showCmpChat([r], 'Satu laporan: No. ' + (r.no || '–') + ' (' + r.sheet + ' baris ' + r.row + ').');
    }
  });
  $('cmp-list').addEventListener('input', function (e) {
    var st = e.target.classList.contains('cmp-input') && e.target.closest('.rec').querySelector('.cmp-status');
    if (st && !st.classList.contains('muted')) st.textContent = '';
  });
  $('cmp-list').addEventListener('keydown', function (e) {
    if (pickerEnter(e, cmpGet, cmpSet, cmpRefreshAll)) return;
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && e.target.classList.contains('cmp-input')) {
      e.preventDefault();
      saveCard(e.target.closest('.rec'));
    }
  });

  // Impor
  $('flash').addEventListener('click', function (e) {
    var id = e.target.id;
    if (id !== 'btn-no-translate' && id !== 'btn-retry-translate') return;
    if (id === 'btn-no-translate') state.translate = false;
    $('btn-import').disabled = true;
    $('btn-import').textContent = 'Memproses…';
    doPreview();
  });
  $('btn-new-sheet').addEventListener('click', function () { openNewSheet('paste'); });
  $('ns-form').addEventListener('submit', doCreateSheet);
  $('ns-cancel').addEventListener('click', closeNewSheet);
  $('ns-code').addEventListener('input', codeHint);
  $('ns-done').addEventListener('click', function (e) {
    var id = e.target.id;
    if (id === 'ns-close') google.script.host.close();
    else if (id === 'ns-back') show('paste');
    else if (id === 'ns-another') openNewSheet(state.newSheetFrom);
  });
  $('btn-preview').addEventListener('click', doPreview);
  $('btn-clear').addEventListener('click', function () { $('src').value = ''; flash(''); $('src').focus(); });
  $('src').addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doPreview(); }
  });
  $('btn-back').addEventListener('click', function () { show('paste'); $('src').focus(); });
  $('btn-import').addEventListener('click', doImport);
  $('sel-all').addEventListener('click', function () { setAll(true); });
  $('sel-none').addEventListener('click', function () { setAll(false); });

  $('rec-list').addEventListener('change', function (e) {
    var t = e.target, id = Number(t.getAttribute('data-id'));
    if (t.type === 'checkbox') {
      state.sel[id] = t.checked;
      var art = t.closest('.rec');
      art.classList.toggle('is-on', t.checked);
      art.classList.toggle('is-off', !t.checked);
      updateCounts();
    } else if (t.classList.contains('disc')) {
      state.disc[id] = t.value;
      t.classList.toggle('is-empty', !t.value);
      t.closest('.rec').querySelector('.foot-row .cells').innerHTML = emptyLine(recById(id));
    } else if (t.classList.contains('mach')) {
      state.machinePick[id] = t.value ? Number(t.value) : '';
      refreshCard(t.closest('.rec'), recById(id));
    }
  });

  // Mode edit kartu di layar Periksa + pemilih nama.
  $('rec-list').addEventListener('click', function (e) {
    if (pickerClick(e, previewGet, previewSet)) return;
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var art = b.closest('.rec'), id = Number(art.getAttribute('data-id'));
    var act = b.getAttribute('data-act');
    if (act === 'edit') {
      state.editing[id] = true;
      var fresh = rerenderCard(id);
      if (fresh) fresh.querySelector('textarea').focus();
    } else if (act === 'done-edit') {
      var bad = art.querySelector('input.invalid');
      if (bad) { bad.focus(); return; }
      state.editing[id] = false;
      rerenderCard(id);
    } else if (act === 'cancel-edit') {
      delete state.edits[id];
      delete state.reporter[id];
      state.editing[id] = false;
      rerenderCard(id);
    } else if (act === 'tr') {
      translateField(art, b.getAttribute('data-key'), b);
    }
  });
  $('rec-list').addEventListener('keydown', function (e) {
    pickerEnter(e, previewGet, previewSet, previewRefreshAll);
  });
  $('rec-list').addEventListener('input', function (e) {
    var k = e.target.getAttribute('data-edit');
    if (!k) return;
    var art = e.target.closest('.rec'), id = Number(art.getAttribute('data-id'));
    (state.edits[id] = state.edits[id] || {})[k] = e.target.value;
    if (k === 'END_TIME' || k === 'DATE') {
      var bad = invalidEdit(k, e.target.value);
      e.target.classList.toggle('invalid', bad);
      art.querySelector('[data-err="' + k + '"]').classList.toggle('hidden', !bad);
    }
    var r = recById(id);
    art.querySelector('.foot-row .cells').innerHTML = emptyLine(r);
    if (k === 'END_TIME') swap(art.querySelector('.strip-slot'), previewStrip(r));
    updateCounts();
  });

  $('view-result').addEventListener('click', function (e) {
    var id = e.target.id;
    if (e.target.classList.contains('res-del')) {
      var x = state.written[Number(e.target.getAttribute('data-i'))];
      if (x && !x.deleted) doDelete(e.target, { sheet: x.sheet, row: x.row, machine: x.cells.C, description: x.cells.D });
      return;
    }
    if (id === 'btn-copy') copyText($('mentor-text'), e.target);
    else if (id === 'btn-close') google.script.host.close();
    else if (id === 'btn-to-complete') openComplete();
    else if (id === 'btn-again') {
      state.preview = null;
      state.translate = true;
      $('src').value = '';
      show('paste');
      $('src').focus();
    }
  });

  boot();
})();
</script>
