<script>
(function () {
  'use strict';

  var state = {
    init: null,
    preview: null,   // hasil previewWeChat
    text: '',        // teks yang dipratinjau = teks yang akan diimpor
    other: '',
    sel: {},         // id -> dicentang?
    disc: {},        // id -> Discipline pilihan
    translate: true, // false setelah memilih "Lanjut tanpa terjemahan"
    newSheetFrom: '', // 'menu' (dialog sendiri) atau 'paste' (dari tautan "+ Sheet baru")
    importView: 'paste', // langkah impor terakhir, dipulihkan saat kembali ke tab Impor
    edits: {},       // id -> { KEY_KOLOM: isi sel yang diubah manual } (lihat Edit.gs)
    editing: {},     // id -> kartu sedang dalam mode edit?
    written: [],     // hasil impor terakhir (untuk menyusun ulang teks mentor)
    mentorOpts: { time: true, pic: true, status: true, where: false },
    cmp: null        // hasil listIncomplete + filter sheet
  };

  // Pertanyaan untuk mentor per kolom kosong (Root Cause & Solution selalu ditanyakan).
  var QUESTIONS = {
    ROOT_CAUSE: 'Root cause?',
    SOLUTION: 'Solusi?',
    MACHINE: 'Proyek / proses (Machine)?',
    DESC: 'Deskripsi masalah?',
    END_TIME: 'Jam selesai?',
    DISCIPLINE: 'Discipline (Machine / Operation / Product Item / MES)?',
    PIC: 'PIC / Responsibility?',
    DATE: 'Tanggal kejadian?'
  };

  // ---------- util ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(new Error((e && e.message) || String(e)));
      });
      r[fn].apply(r, args);
    });
  }
  function cleanErr(e) { return String(e.message || e).replace(/^(Error|Exception):\s*/, ''); }
  function flash(msg, kind) {
    flashHtml(msg ? esc(msg) : '', kind);
  }
  function flashHtml(html, kind) {
    $('flash').innerHTML = html ? '<div class="alert ' + (kind || 'err') + '">' + html + '</div>' : '';
    if (html) window.scrollTo(0, 0);
  }
  function busy(btn, on, label) {
    if (on) { btn.dataset.label = btn.textContent; btn.textContent = label; btn.disabled = true; btn.classList.add('is-busy'); }
    else { btn.textContent = btn.dataset.label || btn.textContent; btn.disabled = false; btn.classList.remove('is-busy'); }
  }
  function empty(text) { return '<span class="empty">' + esc(text || 'kosong') + '</span>'; }
  function colChips(list) {
    return list.map(function (y) { return '<span class="col-chip">' + esc(y.col) + '</span>'; }).join('');
  }
  function selectable(r) { return r.writable && !r.sheetError; }
  function hasChinese(s) { return /[\u4e00-\u9fff]/.test(String(s || '')); }

  function show(view) {
    var order = ['paste', 'preview', 'result'];
    order.concat('newsheet', 'complete').forEach(function (v) { $('view-' + v).classList.toggle('hidden', v !== view); });
    $('actionbar').classList.toggle('hidden', view !== 'preview');
    $('steps').classList.toggle('hidden', order.indexOf(view) === -1);
    $('modes').classList.toggle('hidden', view === 'newsheet');
    if (order.indexOf(view) !== -1) state.importView = view;
    Array.prototype.forEach.call(document.querySelectorAll('#modes button'), function (b) {
      b.classList.toggle('on', (b.getAttribute('data-mode') === 'complete') === (view === 'complete'));
    });
    var idx = order.indexOf(view);
    Array.prototype.forEach.call(document.querySelectorAll('#steps li'), function (li) {
      var i = order.indexOf(li.getAttribute('data-step'));
      li.className = i === idx ? 'on' : (i < idx ? 'done' : '');
    });
    window.scrollTo(0, 0);
  }

  // ---------- 1. Paste ----------
  function boot() {
    if (APP_MODE === 'newsheet') openNewSheet('menu');
    loadInit().catch(function (e) { flash('Gagal memuat: ' + cleanErr(e)); });
    if (APP_MODE === 'complete') openComplete();
    else if (APP_MODE !== 'newsheet') loadComplete(); // hanya untuk angka di tab "Lengkapi"
  }

  /** Muat daftar sheet & rute proyek; `prefer` = sheet yang dipilih di "Sheet untuk proyek lain". */
  function loadInit(prefer) {
    return call('getInitData').then(function (d) {
      state.init = d;
      $('ss-name').textContent = d.spreadsheetName + ' · versi ' + d.version;
      if (d.version !== CLIENT_VERSION) {
        flash('Versi Code.gs (' + d.version + ') berbeda dengan Index.html (' + CLIENT_VERSION + '). ' +
          'Copy ulang KEDUA file dari dist/, simpan, lalu (web app) buat versi deployment baru.');
      }
      var pick = prefer && d.sheets.indexOf(prefer) !== -1 ? prefer : d.defaultOther;
      $('other').innerHTML = d.sheets.map(function (n) {
        return '<option value="' + esc(n) + '"' + (n === pick ? ' selected' : '') + '>' + esc(n) + '</option>';
      }).join('');
      $('other').disabled = !d.sheets.length;
      $('routes').innerHTML = d.projectSheets.map(function (p) {
        return '<span class="route' + (p.ok ? '' : ' bad') + '"><b>' + esc(p.project) + '</b> → ' + esc(p.sheet) +
          (p.ok ? '' : ' (sheet tidak ditemukan)') + '</span>';
      }).join('') || '<span class="muted small">Belum ada (PROJECT_SHEET kosong).</span>';
      $('btn-preview').disabled = !d.sheets.length;
      if (!d.sheets.length && APP_MODE !== 'newsheet') {
        flash('Belum ada sheet issue (header baris ' + d.headerRow + ': No.序号 | Machine | Issue Description). ' +
          'Klik “+ Sheet baru” untuk membuat sheet dengan format manajer.', 'warn');
      }
    });
  }

  function doPreview() {
    var btn = $('btn-preview');
    if (btn.disabled) return;
    var text = $('src').value;
    if (!text.trim()) { flash('Paste dulu teks laporan dari WeChat.', 'warn'); $('src').focus(); return; }
    var other = $('other').value;
    flash('');
    busy(btn, true, 'Memproses…');
    call('previewWeChat', text, other, { translate: state.translate }).then(function (p) {
      if (!p.records.length) {
        flash('Tidak ada laporan terdeteksi. Pastikan teks berisi simbol ①–⑨ dari format laporan WeChat.', 'warn');
        return;
      }
      if (p.translateError) {
        flashHtml(esc(p.translateError) + '<div class="alert-actions">' +
          '<button type="button" class="btn ghost sm" id="btn-retry-translate">Coba lagi</button>' +
          '<button type="button" class="btn ghost sm" id="btn-no-translate">Lanjut tanpa terjemahan</button></div>', 'warn');
      }
      state.preview = p;
      state.text = text;
      state.other = other;
      state.sel = {};
      state.disc = {};
      state.edits = {};
      state.editing = {};
      p.records.forEach(function (r) { state.sel[r.id] = r.include; state.disc[r.id] = r.discipline; });
      renderPreview();
      show('preview');
    }).catch(function (e) { flash(cleanErr(e)); })
      .then(function () { busy(btn, false); });
  }

  // ---------- 2. Periksa ----------
  function stat(id, n, label, cls) {
    return '<div class="stat ' + (cls || '') + '"><b' + (id ? ' id="' + id + '"' : '') + '>' + n + '</b><span>' + esc(label) + '</span></div>';
  }

  function renderPreview() {
    var p = state.preview, recs = p.records;
    var count = function (fn) { return recs.filter(fn).length; };
    var nSkip = count(function (r) { return r.skip; });
    var nWarn = count(function (r) { return r.warnings.length; });
    var nDup = count(function (r) { return r.duplicateOf; });
    var dest = p.sheets.map(function (s) {
      return s.error
        ? '<span class="dest bad">' + esc(s.name) + ': ' + esc(s.error) + '</span>'
        : '<span class="dest"><b>' + esc(s.name) + '</b> · mulai baris ' + s.nextRow + '</span>';
    }).join('');
    var lang = p.translated
      ? '<span class="lang on">中文 + (English)</span> terjemahan mesin (Google Translate); teks asli disimpan di catatan sel'
      : '<span class="lang">Bahasa Indonesia</span> tanpa terjemahan';
    $('summary').innerHTML =
      '<div class="sum-head"><div><div class="sum-big">' + recs.length + ' laporan terdeteksi</div>' +
      '<div class="muted small">Urut dari jam kejadian paling awal. Centang yang mau diimpor.</div>' +
      '<div class="small lang-line">' + lang + '</div></div>' +
      '<div class="sum-dest">' + dest + '</div></div>' +
      '<div class="stats">' +
        stat('sel-count', 0, 'akan diimpor', 'primary') +
        stat('', nSkip, 'default dilewati') +
        stat('', nWarn, 'ada peringatan', nWarn ? 'warn' : '') +
        stat('', nDup, 'duplikat', nDup ? 'warn' : '') +
      '</div>';
    renderCards();
  }

  function renderCards() {
    $('rec-list').innerHTML = state.preview.records.map(card).join('');
    updateCounts();
  }

  function dupText(d) {
    return d.where === 'sheet' ? 'sudah ada: ' + d.sheet + ' baris ' + d.row : 'duplikat di teks ini';
  }

  function card(r) {
    var on = !!state.sel[r.id], can = selectable(r);
    var tags = [];
    if (r.type) tags.push('<span class="tag ' + (r.skip ? '' : (r.discipline ? 'blue' : 'amber')) + '">' + esc(r.type) + '</span>');
    if (r.skip) tags.push('<span class="tag">default tidak diimpor</span>');
    if (r.duplicateOf) tags.push('<span class="tag amber">' + esc(dupText(r.duplicateOf)) + '</span>');
    if (r.sheetError) tags.push('<span class="tag red">' + esc(r.sheetError) + '</span>');
    else if (!r.writable) tags.push('<span class="tag red">tidak bisa ditulis</span>');
    var nEdit = Object.keys(changed(r)).length;
    if (nEdit) tags.push('<span class="tag blue">✎ ' + nEdit + ' sel diedit</span>');
    tags.push('<span class="tag outline">→ ' + esc(r.sheet) + '</span>');
    var editing = !!state.editing[r.id];
    var date = val(r, 'DATE'), end = val(r, 'END_TIME');

    var meta = [
      date ? esc(date) : empty('tanggal ?'),
      r.endDate ? 'selesai ' + esc(r.endDate) : '',
      r.durationText !== '-' ? esc(r.durationText) : ''
    ].filter(Boolean).join(' · ');

    var head =
      '<label class="rec-head">' +
        '<input type="checkbox" data-id="' + r.id + '"' + (on ? ' checked' : '') + (can ? '' : ' disabled') + '>' +
        '<div class="when"><div class="time">' + (r.start ? esc(r.start) : empty('?')) +
          '<span class="arrow">→</span>' + (end ? esc(end) : empty('?')) + '</div>' +
          '<div class="meta">' + meta + '</div></div>' +
        '<div class="tags">' + tags.join('') + '</div>' +
      '</label>';

    var e1 = val(r, 'ROOT_CAUSE'), f1 = val(r, 'SOLUTION'), k1 = val(r, 'NOTES');
    var body = editing ? editForm(r, can) :
      '<div class="rec-body">' +
        biField('Machine (C)', val(r, 'MACHINE'), r.translated && r.machine) +
        '<div class="field"><div class="k">Discipline (H)</div><div class="v">' + disciplineSelect(r, can) + '</div></div>' +
        biField('Deskripsi (D)', val(r, 'DESC'), r.translated && r.description, 'wide') +
        (e1 ? biField('Root Cause (E)', e1, '', 'wide') : '') +
        (f1 ? biField('Solution (F)', f1, '', 'wide') : '') +
        field('PIC (I)', val(r, 'PIC')) +
        field('Level · Status', [r.level, r.lineStatus, r.handling].filter(Boolean).join(' · ')) +
        (k1 ? biField('Notes (K)', k1, '', 'wide notes-k') : '') +
      '</div>';

    var warns = r.warnings.length
      ? '<ul class="warns">' + r.warnings.map(function (w) {
          return '<li>' + (w.col ? '<span class="col-chip">' + esc(w.col) + '</span>' : '<span class="col-chip note">!</span>') +
            '<span>' + esc(w.msg) + '</span></li>';
        }).join('') + '</ul>'
      : '';
    var editBtns = !can ? '' : editing
      ? '<button type="button" class="btn ghost sm" data-act="cancel-edit">Batalkan perubahan</button>' +
        '<button type="button" class="btn primary sm" data-act="done-edit">✓ Selesai edit</button>'
      : '<button type="button" class="btn ghost sm" data-act="edit">✎ Edit isi sel</button>';
    var foot = '<div class="rec-foot">' + warns +
      '<div class="foot-row"><div class="cells">' + emptyLine(r) + '</div>' +
      '<div class="foot-actions">' + editBtns + '</div></div></div>';

    var cls = 'rec ' + (on ? 'is-on' : 'is-off') + (can ? '' : ' is-blocked');
    return '<article class="' + cls + '" data-id="' + r.id + '">' + head + body + foot + '</article>';
  }

  function field(label, value, cls) {
    return '<div class="field ' + (cls || '') + '"><div class="k">' + esc(label) + '</div><div class="v">' +
      (value ? esc(value) : empty()) + '</div></div>';
  }

  /** "中文\n(English)" ditampilkan dua baris; `original` = teks asli Indonesia (kalau diterjemahkan). */
  function biField(label, value, original, cls) {
    var i = value ? value.indexOf('\n(') : -1;
    var shown = !value ? empty()
      : i === -1 ? esc(value)
      : '<span class="zh">' + esc(value.slice(0, i)) + '</span><span class="en">' + esc(value.slice(i + 1)) + '</span>';
    return '<div class="field ' + (cls || '') + '"><div class="k">' + esc(label) + '</div><div class="v bi">' + shown +
      (original ? '<span class="orig">Asli: ' + esc(original) + '</span>' : '') + '</div></div>';
  }

  function disciplineSelect(r, can) {
    var cur = state.disc[r.id] || '';
    var opts = ['<option value="">— kosong —</option>'].concat(state.init.disciplines.map(function (d) {
      return '<option value="' + esc(d) + '"' + (d === cur ? ' selected' : '') + '>' + esc(d) + '</option>';
    }));
    var hint = r.discipline ? 'otomatis dari “' + r.type + '”'
      : (r.type ? '“' + r.type + '” belum dipetakan, pilih manual atau biarkan kosong' : 'jenis ⑥-1 kosong');
    return '<select class="disc' + (cur ? '' : ' is-empty') + '" data-id="' + r.id + '"' + (can ? '' : ' disabled') + '>' +
      opts.join('') + '</select><div class="hint">' + esc(hint) + '</div>';
  }

  function picks() {
    return state.preview.records
      .filter(function (r) { return state.sel[r.id] && selectable(r); })
      .map(function (r) {
        var p = { id: r.id, discipline: state.disc[r.id] };
        var c = changed(r);
        if (Object.keys(c).length) p.cells = c;
        return p;
      });
  }

  // ---------- Edit isi sel sebelum impor (Edit.gs) ----------
  var TIME_RE = /^(\d{1,2})\s*[:.]\s*(\d{2})$/;
  var DATE_RE = /^(\d{4})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})$/;

  /** Isi sel hasil parser (yang akan ditulis kalau tidak diedit). */
  function defaults(r) {
    return { MACHINE: r.cells.C || '', DESC: r.cells.D || '', ROOT_CAUSE: '', SOLUTION: '',
      END_TIME: r.end || '', PIC: r.pic || '', DATE: r.date || '', NOTES: r.cells.K || '' };
  }
  function val(r, k) {
    var e = state.edits[r.id];
    return e && e.hasOwnProperty(k) ? e[k] : defaults(r)[k];
  }
  /** Hanya kolom yang benar-benar berbeda dari hasil parser. */
  function changed(r) {
    var e = state.edits[r.id] || {}, d = defaults(r), out = {};
    Object.keys(e).forEach(function (k) { if (e[k] !== d[k]) out[k] = e[k]; });
    return out;
  }
  function invalidEdit(k, v) {
    v = String(v || '').trim();
    if (!v || (k !== 'END_TIME' && k !== 'DATE')) return false;
    if (k === 'END_TIME') { var t = TIME_RE.exec(v); return !t || +t[1] > 23 || +t[2] > 59; }
    var d = DATE_RE.exec(v);
    if (!d) return true;
    var dt = new Date(Date.UTC(+d[1], +d[2] - 1, +d[3]));
    return dt.getUTCMonth() !== +d[2] - 1 || dt.getUTCDate() !== +d[3];
  }
  function hasInvalid(r) {
    var c = changed(r);
    return ['END_TIME', 'DATE'].some(function (k) { return c.hasOwnProperty(k) && invalidEdit(k, c[k]); });
  }
  function emptyLine(r) {
    var list = emptyNow(r);
    return 'Perlu dilengkapi manual: ' + (list.length ? colChips(list) : '<span class="ok-text">tidak ada ✓</span>');
  }
  function emptyNow(r) {
    return [['ROOT_CAUSE', 'E'], ['SOLUTION', 'F'], ['MACHINE', 'C'], ['DESC', 'D'], ['END_TIME', 'G'],
      ['DISCIPLINE', 'H'], ['PIC', 'I'], ['DATE', 'J']].filter(function (p) {
      var v = p[0] === 'DISCIPLINE' ? state.disc[r.id] : val(r, p[0]);
      return !String(v || '').trim();
    }).map(function (p) { return { key: p[0], col: p[1] }; });
  }

  function editText(r, k, label, rows, orig) {
    var tr = state.preview.translated
      ? '<button type="button" class="link small" data-act="tr" data-key="' + k + '">↻ Terjemahkan</button>' : '';
    return '<div class="field"><div class="label-row"><label class="k" for="ed-' + r.id + '-' + k + '">' + esc(label) + '</label>' + tr + '</div>' +
      '<textarea id="ed-' + r.id + '-' + k + '" data-edit="' + k + '" rows="' + rows + '">' + esc(val(r, k)) + '</textarea>' +
      (orig ? '<p class="hint">Asli: ' + esc(orig) + '</p>' : '') + '</div>';
  }
  function editInput(r, k, label, ph) {
    var v = val(r, k), bad = invalidEdit(k, v);
    return '<div class="field"><label class="k" for="ed-' + r.id + '-' + k + '">' + esc(label) + '</label>' +
      '<input type="text" id="ed-' + r.id + '-' + k + '" data-edit="' + k + '" value="' + esc(v) + '" placeholder="' + esc(ph) + '"' +
      (bad ? ' class="invalid"' : '') + '>' +
      ((k === 'END_TIME' || k === 'DATE') ? '<p class="hint err-text' + (bad ? '' : ' hidden') + '" data-err="' + k + '">Format: ' +
        (k === 'DATE' ? 'tahun/bulan/tanggal, mis. 2026/10/20' : 'jam:menit, mis. 20:30') + '</p>' : '') + '</div>';
  }
  function editForm(r, can) {
    return '<div class="rec-body edit-form">' +
      editText(r, 'MACHINE', 'Machine (C)', 2, r.machine) +
      editText(r, 'DESC', 'Deskripsi (D)', 3, r.description) +
      editText(r, 'ROOT_CAUSE', 'Root Cause (E)', 3) +
      editText(r, 'SOLUTION', 'Solution (F)', 3) +
      '<div class="wide edit-row">' +
        editInput(r, 'END_TIME', 'End Time (G)', 'mis. 20:30') +
        '<div class="field"><div class="k">Discipline (H)</div>' + disciplineSelect(r, can) + '</div>' +
        editInput(r, 'PIC', 'PIC (I)', 'nama, pisahkan dengan koma') +
        editInput(r, 'DATE', 'Date (J)', 'mis. 2026/10/20') +
      '</div>' +
      '<div class="wide">' + editText(r, 'NOTES', 'Notes (K)', 3) + '</div>' +
      '<p class="hint wide">' + (state.preview.translated
        ? 'Teks tanpa huruf Mandarin dianggap Bahasa Indonesia dan diterjemahkan saat impor; klik ↻ untuk melihat hasilnya sekarang. Teks berhuruf Mandarin ditulis apa adanya.'
        : 'Tanpa terjemahan: isi ditulis apa adanya.') + '</p>' +
    '</div>';
  }

  function rerenderCard(id) {
    var r = state.preview.records.filter(function (x) { return x.id === id; })[0];
    var art = document.querySelector('#rec-list .rec[data-id="' + id + '"]');
    if (!r || !art) return null;
    var tmp = document.createElement('div');
    tmp.innerHTML = card(r);
    var fresh = tmp.firstChild;
    art.parentNode.replaceChild(fresh, art);
    updateCounts();
    return fresh;
  }

  function translateField(art, key, btn) {
    var id = Number(art.getAttribute('data-id'));
    var ta = art.querySelector('[data-edit="' + key + '"]');
    if (!ta || !ta.value.trim()) return;
    busy(btn, true, 'Menerjemahkan…');
    call('translateCell', key, ta.value).then(function (res) {
      ta.value = res.value;
      (state.edits[id] = state.edits[id] || {})[key] = res.value;
      updateCounts();
    }).catch(function (e) { flash(cleanErr(e)); })
      .then(function () { busy(btn, false); });
  }

  function updateCounts() {
    var n = picks().length, total = state.preview.records.length;
    var blocked = !!state.preview.translateError; // impor dengan terjemahan pasti gagal lagi
    var invalid = state.preview.records.some(function (r) { return state.sel[r.id] && hasInvalid(r); });
    if ($('sel-count')) $('sel-count').textContent = n;
    $('act-note').textContent = n + ' dari ' + total + ' laporan dipilih';
    var btn = $('btn-import');
    if (!btn.classList.contains('is-busy')) {
      btn.textContent = blocked ? 'Terjemahan gagal' : invalid ? 'Ada jam/tanggal tidak valid'
        : (n ? 'Impor ' + n + ' laporan' : 'Belum ada yang dipilih');
      btn.disabled = !n || blocked || invalid;
    }
  }

  function setAll(on) {
    state.preview.records.forEach(function (r) { if (selectable(r)) state.sel[r.id] = on; });
    renderCards();
  }

  function doImport() {
    var list = picks();
    if (!list.length) return;
    var btn = $('btn-import');
    busy(btn, true, 'Menulis ke sheet…');
    $('btn-back').disabled = true;
    call('importWeChat', state.text, state.other, list, { translate: state.translate }).then(function (res) {
      flash('');
      loadComplete().catch(function () { /* angka di tab Lengkapi saja */ });
      renderResult(res);
      show('result');
    }).catch(function (e) { flash('Gagal menulis: ' + cleanErr(e)); })
      .then(function () { busy(btn, false); $('btn-back').disabled = false; updateCounts(); });
  }

  // ---------- 3. Selesai ----------
  function rowUrl(url, x) { return url.replace(/#.*$/, '') + '#gid=' + x.sheetId + '&range=B' + x.row; }

  function rowsText(rows) {
    rows = rows.slice().sort(function (a, b) { return a - b; });
    var contiguous = rows.every(function (r, i) { return i === 0 || r === rows[i - 1] + 1; });
    return contiguous && rows.length > 1 ? rows[0] + '–' + rows[rows.length - 1] : rows.join(', ');
  }

  function renderResult(res) {
    var w = res.written;
    var bySheet = {};
    w.forEach(function (x) { (bySheet[x.sheet] = bySheet[x.sheet] || []).push(x.row); });
    var where = Object.keys(bySheet).map(function (s) { return s + ' baris ' + rowsText(bySheet[s]); }).join('; ');

    var hero = '<div class="card hero' + (w.length ? '' : ' empty-result') + '">' +
      '<div class="hero-icon">' + (w.length ? '✓' : '!') + '</div>' +
      '<div class="grow"><h1>' + (w.length ? w.length + ' laporan ditulis' : 'Tidak ada yang ditulis') + '</h1>' +
      '<p class="muted">' + (w.length ? esc(where) + '. Lengkapi kolom yang kosong setelah tanya mentor.' : 'Lihat pesan di bawah.') + '</p></div>' +
      '<a class="btn ghost" href="' + esc(res.url) + '" target="_blank" rel="noopener">Buka spreadsheet ↗</a></div>';

    var errors = res.errors.length
      ? '<div class="alert err"><b>Tidak ditulis:</b><ul>' + res.errors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>'
      : '';

    var table = w.length ? '<div class="card"><h2>Baris yang ditulis</h2><div class="table-wrap"><table>' +
      '<thead><tr><th>No.</th><th>Sheet · baris</th><th>Waktu</th><th>Machine · Deskripsi</th><th>Perlu dilengkapi</th></tr></thead><tbody>' +
      w.map(function (x) {
        return '<tr><td class="num">' + esc(x.no) + '</td>' +
          '<td class="nowrap"><a href="' + esc(rowUrl(res.url, x)) + '" target="_blank" rel="noopener">' + esc(x.sheet) + ' · ' + x.row + ' ↗</a></td>' +
          '<td class="nowrap">' + esc([x.date, x.start].filter(Boolean).join(' ')) + '</td>' +
          '<td>' + (x.machine ? esc(x.machine) : empty()) + '<div class="muted small clamp">' + esc(x.description) + '</div></td>' +
          '<td><div class="chips">' + colChips(x.empty) + '</div></td></tr>';
      }).join('') + '</tbody></table></div></div>' : '';

    state.written = w;
    var opt = function (k, label) {
      return '<label><input type="checkbox" data-opt="' + k + '"' + (state.mentorOpts[k] ? ' checked' : '') + '> ' + esc(label) + '</label>';
    };
    var mentor = w.length ? '<div class="card"><div class="card-row"><h2>Pertanyaan untuk mentor</h2>' +
      '<button type="button" class="btn ghost sm" id="btn-copy">Salin</button></div>' +
      '<div class="muted small">Teks siap kirim untuk melengkapi kolom yang kosong. Boleh diedit langsung di kotak ini.</div>' +
      '<div class="mentor-opts"><span>Sertakan:</span>' + opt('time', 'Waktu & durasi') + opt('pic', 'PIC') +
        opt('status', 'Jenis & status') + opt('where', 'Sheet & baris') +
        '<span class="hint">Mengubah pilihan menyusun ulang teks.</span></div>' +
      '<textarea id="mentor-text" class="mono">' + esc(mentorText(w)) + '</textarea></div>' : '';

    var actions = '<div class="end-actions">' +
      (w.length ? '<button type="button" class="btn ghost" id="btn-to-complete">Lengkapi Root Cause / Solution →</button>' : '') +
      (APP_MODE === 'dialog' ? '<button type="button" class="btn ghost" id="btn-close">Tutup</button>' : '') +
      '<button type="button" class="btn primary" id="btn-again">Paste laporan berikutnya</button></div>';

    $('view-result').innerHTML = hero + errors + table + mentor + actions;
  }

  function minutesBetween(a, b) {
    var p = function (s) { var m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return m ? +m[1] * 60 + +m[2] : null; };
    var x = p(a), y = p(b);
    return x !== null && y !== null && y >= x ? y - x : null;
  }

  function mentorText(written) {
    var o = state.mentorOpts;
    var rows = written.filter(function (x) { return x.empty.some(function (y) { return QUESTIONS[y.key]; }); });
    if (!rows.length) return 'Semua kolom sudah terisi, tidak ada yang perlu ditanyakan.';
    var out = ['Mohon bantuannya untuk melengkapi laporan berikut:', ''];
    rows.forEach(function (x, i) {
      out.push((i + 1) + ') No. ' + x.no + ' · ' + (x.machine || '-'));
      if (o.time) {
        var d = minutesBetween(x.start, x.end);
        var dur = d !== null ? d + ' menit' : (x.durationText && x.durationText !== '-' ? x.durationText : '');
        var when = [x.date, [x.start, x.end].filter(Boolean).join('–')].filter(Boolean).join(' ');
        if (when || dur) out.push('   Waktu: ' + when + (dur ? ' (' + dur + ')' : ''));
      }
      if (x.description) out.push('   Masalah: ' + x.description.replace(/\s*\n\s*/g, '; '));
      if (o.pic && x.pic) out.push('   PIC: ' + x.pic);
      if (o.status) {
        var st = [x.type && 'Jenis: ' + x.type, x.lineStatus && 'Status lini: ' + x.lineStatus,
          x.handling && 'Penanganan: ' + x.handling].filter(Boolean).join(' · ');
        if (st) out.push('   ' + st);
      }
      if (o.where) out.push('   Lokasi: ' + x.sheet + ' baris ' + x.row);
      x.empty.forEach(function (y) {
        var q = QUESTIONS[y.key];
        if (!q) return;
        if (y.key === 'DISCIPLINE' && x.type) q += ' (jenis dari operator: "' + x.type + '")';
        out.push('   - ' + q);
      });
      out.push('');
    });
    return out.join('\n').trim();
  }

  function copyText(ta, btn) {
    var done = function () {
      btn.textContent = 'Tersalin ✓';
      setTimeout(function () { btn.textContent = 'Salin'; }, 1600);
    };
    var fallback = function () {
      ta.focus();
      ta.select();
      try { if (document.execCommand('copy')) { done(); return; } } catch (e) { /* lanjut ke pesan */ }
      flash('Browser menolak menyalin otomatis. Teks sudah dipilih: tekan Ctrl+C.', 'warn');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, fallback);
    else fallback();
  }

  // ---------- Buat sheet baru ----------
  function codeHint() {
    var code = $('ns-code').value.trim();
    $('ns-code-hint').textContent = code
      ? 'Laporan dengan “②Nama proyek: ' + code + '” otomatis masuk ke sheet ini (huruf besar/kecil, spasi, strip diabaikan).'
      : 'Kosong = sheet ini dipilih manual di “Sheet untuk proyek lain” saat impor.';
  }

  function openNewSheet(from) {
    state.newSheetFrom = from;
    $('ns-form').reset();
    $('ns-form').classList.remove('hidden');
    $('ns-done').classList.add('hidden');
    codeHint();
    flash('');
    show('newsheet');
    $('ns-name').focus();
  }

  function closeNewSheet() {
    if (state.newSheetFrom === 'menu') google.script.host.close();
    else show('paste');
  }

  function doCreateSheet(e) {
    e.preventDefault();
    var btn = $('ns-submit');
    if (btn.disabled) return;
    var opts = { sheetName: $('ns-name').value.trim(), projectName: $('ns-project').value.trim(), projectCode: $('ns-code').value.trim() };
    if (!opts.sheetName) { flash('Nama sheet wajib diisi.', 'warn'); $('ns-name').focus(); return; }
    flash('');
    busy(btn, true, 'Membuat sheet…');
    call('createIssueSheet', opts).then(function (res) {
      renderSheetDone(res);
      return loadInit(res.code ? null : res.sheet);
    }).catch(function (err) { flash(cleanErr(err)); })
      .then(function () { busy(btn, false); });
  }

  function renderSheetDone(res) {
    var items = [
      'Format sheet manajer: header bilingual di baris 8, Status Overview, dropdown Discipline, nomor 1–14 (baris data ' + esc(res.dataRows) + ').',
      res.code
        ? 'Laporan dengan <b>②Nama proyek: ' + esc(res.code) + '</b> otomatis masuk ke sheet ini.'
        : 'Tanpa kode proyek: pilih sheet ini di “Sheet untuk proyek lain” saat impor.',
      'Teks besar di B4: <b>' + esc(res.projectName) + '</b>.'
    ];
    if (res.createdRevision) items.push('Sheet <b>Revision_History</b> ikut dibuat (judul di B6 membaca nomor revisi dari sana).');
    var buttons = state.newSheetFrom === 'menu'
      ? '<button type="button" class="btn primary" id="ns-close">Tutup</button>'
      : '<button type="button" class="btn ghost" id="ns-another">Buat lagi</button>' +
        '<button type="button" class="btn primary" id="ns-back">Kembali ke impor</button>';
    $('ns-done').innerHTML =
      '<div class="done-head"><div class="hero-icon">✓</div><h2>Sheet “' + esc(res.sheet) + '” dibuat</h2></div>' +
      '<ul class="done-list">' + items.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' +
      '<div class="actions">' + buttons + '</div>';
    $('ns-form').classList.add('hidden');
    $('ns-done').classList.remove('hidden');
  }

  // ---------- Lengkapi (E/F/H) ----------
  function loadComplete() {
    return call('listIncomplete').then(function (d) {
      state.cmp = { rows: d.rows, total: d.total, url: d.url, translate: d.translate, sheets: d.sheets, disciplines: d.disciplines,
        filter: state.cmp ? state.cmp.filter : '' };
      $('cmp-badge').textContent = d.total ? d.total : '';
      return d;
    });
  }

  function openComplete() {
    flash('');
    show('complete');
    $('cmp-title').textContent = 'Memuat…';
    $('cmp-list').innerHTML = '<div class="loading">Membaca sheet…</div>';
    loadComplete().then(renderComplete).catch(function (e) {
      $('cmp-list').innerHTML = '';
      flash('Gagal memuat daftar: ' + cleanErr(e));
    });
  }

  function cmpRows() {
    var f = state.cmp.filter;
    return state.cmp.rows.filter(function (r) { return !f || r.sheet === f; });
  }

  function renderComplete() {
    var c = state.cmp;
    var open = c.rows.filter(function (r) { return r.need.length; }).length;
    $('cmp-title').textContent = open ? open + ' baris perlu dilengkapi' : 'Semua baris sudah lengkap';
    if (c.total > c.rows.length) $('cmp-title').textContent += ' (menampilkan ' + c.rows.length + ' terbaru dari ' + c.total + ')';
    var counts = {};
    c.rows.forEach(function (r) { counts[r.sheet] = (counts[r.sheet] || 0) + 1; });
    $('cmp-sheet').innerHTML = '<option value="">Semua sheet</option>' + c.sheets.map(function (n) {
      return '<option value="' + esc(n) + '"' + (n === c.filter ? ' selected' : '') + '>' + esc(n) + ' (' + (counts[n] || 0) + ')</option>';
    }).join('');
    var rows = cmpRows();
    $('cmp-list').innerHTML = rows.length ? rows.map(cmpCard).join('')
      : '<div class="card center muted">Tidak ada baris yang perlu dilengkapi' + (c.filter ? ' di sheet ini' : '') + '.</div>';
  }

  function cmpKey(r) { return r.sheet + '|' + r.row; }

  function cmpText(label, name, value, r) {
    if (hasChinese(value)) return biField(label, value, '');
    return '<div class="field"><label class="k" for="' + name + '-' + r.row + '-' + esc(r.sheetId) + '">' + esc(label) + '</label>' +
      '<textarea class="cmp-input" data-name="' + name + '" id="' + name + '-' + r.row + '-' + esc(r.sheetId) + '" rows="3" ' +
      'placeholder="Tulis dalam Bahasa Indonesia…">' + esc(value) + '</textarea>' +
      (value ? '<p class="hint">Belum diterjemahkan. Simpan untuk menerjemahkan.</p>' : '') + '</div>';
  }

  function cmpCard(r) {
    var done = !r.need.length;
    var head =
      '<div class="rec-head static">' +
        '<div class="when"><div class="time">No. ' + esc(r.no || '–') + '<span class="arrow">·</span>' + (r.date ? esc(r.date) : empty('tanggal ?')) +
          (r.end ? ' ' + esc(r.end) : '') + '</div>' +
          '<div class="meta">' + esc(r.sheet) + ' · baris ' + r.row + '</div></div>' +
        '<div class="tags">' + (done ? '<span class="tag green">✓ Lengkap</span>'
          : '<span class="tag">Perlu: ' + r.need.map(function (n) { return n.col; }).join(', ') + '</span>') +
          '<a class="tag outline" href="' + esc(rowUrl(state.cmp.url, r)) + '" target="_blank" rel="noopener">Buka di sheet ↗</a></div>' +
      '</div>';
    var body = '<div class="rec-body">' + biField('Machine (C)', r.machine, r.machineOrig) +
      biField('Deskripsi (D)', r.description, r.descOrig, 'wide') + field('PIC (I)', r.pic) + '</div>';
    var disc = isEmptyStr(r.discipline)
      ? '<div class="field"><label class="k">Discipline (H)</label><select class="cmp-input disc is-empty" data-name="discipline">' +
        '<option value="">— kosong —</option>' + state.cmp.disciplines.map(function (d) {
          return '<option value="' + esc(d) + '">' + esc(d) + '</option>';
        }).join('') + '</select></div>'
      : field('Discipline (H)', r.discipline);
    var form = '<div class="rec-body cmp-form">' +
      cmpText('Root Cause (E)', 'rootCause', r.rootCause, r) + cmpText('Solution (F)', 'solution', r.solution, r) + disc + '</div>';
    var foot = done ? '' : '<div class="rec-foot cmp-actions"><span class="cmp-status small"></span>' +
      '<button type="button" class="btn primary sm cmp-save">' + (state.cmp.translate ? 'Simpan &amp; terjemahkan' : 'Simpan') + '</button></div>';
    return '<article class="rec cmp ' + (done ? 'is-done' : 'is-on') + '" data-key="' + esc(cmpKey(r)) + '">' + head + body + form + foot + '</article>';
  }

  function isEmptyStr(s) { return !String(s || '').trim(); }

  function saveCard(art) {
    var r = state.cmp.rows.filter(function (x) { return cmpKey(x) === art.getAttribute('data-key'); })[0];
    var btn = art.querySelector('.cmp-save');
    var status = art.querySelector('.cmp-status');
    if (!r || !btn || btn.disabled) return;
    var item = { sheet: r.sheet, row: r.row,
      expect: { machine: r.machine, description: r.description, rootCause: r.rootCause, solution: r.solution, discipline: r.discipline } };
    Array.prototype.forEach.call(art.querySelectorAll('.cmp-input'), function (el) { item[el.getAttribute('data-name')] = el.value; });
    if (isEmptyStr(item.rootCause) && isEmptyStr(item.solution) && !item.discipline) {
      status.className = 'cmp-status small warn-text';
      status.textContent = 'Isi Root Cause, Solution, atau Discipline dulu.';
      return;
    }
    status.className = 'cmp-status small muted';
    status.textContent = state.cmp.translate ? 'Menerjemahkan & menyimpan…' : 'Menyimpan…';
    busy(btn, true, 'Menyimpan…');
    call('saveCompletion', item).then(function (r2) {
      state.cmp.rows = state.cmp.rows.map(function (x) { return cmpKey(x) === cmpKey(r2) ? r2 : x; });
      var open = state.cmp.rows.filter(function (x) { return x.need.length; }).length;
      state.cmp.total = Math.max(0, state.cmp.total - (r2.need.length ? 0 : 1));
      $('cmp-badge').textContent = state.cmp.total || '';
      var tmp = document.createElement('div');
      tmp.innerHTML = cmpCard(r2);
      var fresh = tmp.firstChild;
      art.parentNode.replaceChild(fresh, art);
      var st = fresh.querySelector('.cmp-status');
      if (st) { st.className = 'cmp-status small ok-text'; st.textContent = '✓ Tersimpan. Masih perlu: ' + r2.need.map(function (n) { return n.col; }).join(', '); }
      $('cmp-title').textContent = open ? open + ' baris perlu dilengkapi' : 'Semua baris sudah lengkap';
    }).catch(function (e) {
      busy(btn, false);
      status.className = 'cmp-status small err-text';
      status.textContent = cleanErr(e);
    });
  }

  // ---------- event ----------
  $('modes').addEventListener('click', function (e) {
    var m = e.target.closest('button[data-mode]');
    if (!m) return;
    if (m.getAttribute('data-mode') === 'complete') openComplete();
    else { flash(''); show(state.importView); }
  });
  $('cmp-reload').addEventListener('click', openComplete);
  $('cmp-sheet').addEventListener('change', function () { state.cmp.filter = this.value; renderComplete(); });
  $('cmp-list').addEventListener('click', function (e) {
    if (e.target.classList.contains('cmp-save')) saveCard(e.target.closest('.rec'));
  });
  $('cmp-list').addEventListener('input', function (e) {
    var st = e.target.classList.contains('cmp-input') && e.target.closest('.rec').querySelector('.cmp-status');
    if (st && !st.classList.contains('muted')) st.textContent = '';
  });
  $('cmp-list').addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && e.target.classList.contains('cmp-input')) {
      e.preventDefault();
      saveCard(e.target.closest('.rec'));
    }
  });
  $('flash').addEventListener('click', function (e) {
    var id = e.target.id;
    if (id !== 'btn-no-translate' && id !== 'btn-retry-translate') return;
    if (id === 'btn-no-translate') state.translate = false;
    $('btn-import').disabled = true;
    $('btn-import').textContent = 'Memproses…';
    doPreview();
  });
  $('btn-new-sheet').addEventListener('click', function () { openNewSheet('paste'); });
  $('ns-form').addEventListener('submit', doCreateSheet);
  $('ns-cancel').addEventListener('click', closeNewSheet);
  $('ns-code').addEventListener('input', codeHint);
  $('ns-done').addEventListener('click', function (e) {
    var id = e.target.id;
    if (id === 'ns-close') google.script.host.close();
    else if (id === 'ns-back') show('paste');
    else if (id === 'ns-another') openNewSheet(state.newSheetFrom);
  });
  $('btn-preview').addEventListener('click', doPreview);
  $('btn-clear').addEventListener('click', function () { $('src').value = ''; flash(''); $('src').focus(); });
  $('src').addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doPreview(); }
  });
  $('btn-back').addEventListener('click', function () { show('paste'); $('src').focus(); });
  $('btn-import').addEventListener('click', doImport);
  $('sel-all').addEventListener('click', function () { setAll(true); });
  $('sel-none').addEventListener('click', function () { setAll(false); });

  $('rec-list').addEventListener('change', function (e) {
    var t = e.target, id = Number(t.getAttribute('data-id'));
    if (t.type === 'checkbox') {
      state.sel[id] = t.checked;
      var art = t.closest('.rec');
      art.classList.toggle('is-on', t.checked);
      art.classList.toggle('is-off', !t.checked);
      updateCounts();
    } else if (t.classList.contains('disc')) {
      state.disc[id] = t.value;
      t.classList.toggle('is-empty', !t.value);
    }
  });

  $('view-result').addEventListener('change', function (e) {
    var k = e.target.getAttribute('data-opt');
    if (!k) return;
    state.mentorOpts[k] = e.target.checked;
    $('mentor-text').value = mentorText(state.written);
  });

  // Mode edit kartu di layar Periksa.
  $('rec-list').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var art = b.closest('.rec'), id = Number(art.getAttribute('data-id'));
    var act = b.getAttribute('data-act');
    if (act === 'edit') {
      state.editing[id] = true;
      var fresh = rerenderCard(id);
      if (fresh) fresh.querySelector('textarea').focus();
    } else if (act === 'done-edit') {
      var bad = art.querySelector('input.invalid');
      if (bad) { bad.focus(); return; }
      state.editing[id] = false;
      rerenderCard(id);
    } else if (act === 'cancel-edit') {
      delete state.edits[id];
      state.editing[id] = false;
      rerenderCard(id);
    } else if (act === 'tr') {
      translateField(art, b.getAttribute('data-key'), b);
    }
  });
  $('rec-list').addEventListener('input', function (e) {
    var k = e.target.getAttribute('data-edit');
    if (!k) return;
    var art = e.target.closest('.rec'), id = Number(art.getAttribute('data-id'));
    (state.edits[id] = state.edits[id] || {})[k] = e.target.value;
    if (k === 'END_TIME' || k === 'DATE') {
      var bad = invalidEdit(k, e.target.value);
      e.target.classList.toggle('invalid', bad);
      art.querySelector('[data-err="' + k + '"]').classList.toggle('hidden', !bad);
    }
    var r = state.preview.records.filter(function (x) { return x.id === id; })[0];
    art.querySelector('.foot-row .cells').innerHTML = emptyLine(r);
    updateCounts();
  });

  $('view-result').addEventListener('click', function (e) {
    var id = e.target.id;
    if (id === 'btn-copy') copyText($('mentor-text'), e.target);
    else if (id === 'btn-close') google.script.host.close();
    else if (id === 'btn-to-complete') openComplete();
    else if (id === 'btn-again') {
      state.preview = null;
      state.translate = true;
      $('src').value = '';
      show('paste');
      $('src').focus();
    }
  });

  boot();
})();
</script>
