<style>
  :root {
    --bg: #f3f5f8; --card: #fff; --text: #17202b; --muted: #5b6878; --faint: #8592a1;
    --line: #e1e6ec; --line-strong: #c9d1da; --chip: #eef1f5;
    --primary: #0b5cad; --primary-hover: #094b8e; --primary-text: #fff; --primary-weak: #e7f0fb;
    --brand: #07c160;
    --ok: #157347; --ok-bg: #e3f4ea;
    --warn: #8a5a00; --warn-bg: #fff4d6;
    --ng: #b42318; --ng-bg: #fdeceb;
    --cell: #FFF2CC; --cell-text: #6b5200;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .07);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1318; --card: #181d24; --text: #e6eaef; --muted: #9ba7b4; --faint: #7d8896;
      --line: #2a313a; --line-strong: #3a434e; --chip: #232a33;
      --primary: #5aa2ff; --primary-hover: #7ab4ff; --primary-text: #08111d; --primary-weak: #142538;
      --ok: #5dd39e; --ok-bg: #12301f;
      --warn: #ffcc66; --warn-bg: #33270b;
      --ng: #ff8a80; --ng-bg: #3a1614;
      --cell: #4a3d10; --cell-text: #ffe39a;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 80px; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  h1 { font-size: 19px; margin: 0 0 4px; letter-spacing: -.01em; }
  h2 { font-size: 16px; margin: 0; }
  code, kbd, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  code { background: var(--chip); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  kbd { background: var(--card); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 11.5px; }
  a { color: var(--primary); }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .hidden { display: none !important; }

  /* ---------- header ---------- */
  header.top { position: sticky; top: 0; z-index: 10; background: var(--card); background: color-mix(in srgb, var(--card) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(8px); -webkit-backdrop-filter: saturate(1.4) blur(8px); border-bottom: 1px solid var(--line); }
  header.top .inner, .wrap, .actionbar .inner { max-width: 1040px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }
  header.top .inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 10px; padding-bottom: 10px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: #fff;
    background: linear-gradient(135deg, #20d07a, var(--brand) 55%, #05a653); box-shadow: 0 2px 6px rgba(7, 193, 96, .35); }
  .title { font-weight: 700; font-size: 15px; }
  .sub { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; }
  .steps li { display: flex; align-items: center; gap: 6px; padding: 5px 12px 5px 6px; border-radius: 999px; color: var(--faint); font-weight: 600; font-size: 12.5px; }
  .steps li span { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; background: var(--chip); color: var(--muted); }
  .steps li.on { background: var(--primary-weak); color: var(--primary); }
  .steps li.on span { background: var(--primary); color: var(--primary-text); }
  .steps li.done { color: var(--ok); }
  .steps li.done span { background: var(--ok-bg); color: var(--ok); }

  /* ---------- layout ---------- */
  .wrap { padding-top: 20px; padding-bottom: 120px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 14px; }
  .lead { margin: 0 0 14px; max-width: 70ch; }
  label, .label { display: block; font-weight: 600; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  textarea, select, input[type=text] { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line-strong); border-radius: 10px; }
  input[type=text] { padding: 9px 12px; background: var(--card); }
  textarea { min-height: 280px; padding: 12px 14px; font-size: 13px; line-height: 1.6; resize: vertical; }
  select { padding: 8px 10px; background-color: var(--card); }
  textarea:focus, select:focus, input[type=text]:focus, .btn:focus-visible, .link:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; border-color: transparent; }
  textarea::placeholder { color: var(--faint); }

  .opts { display: grid; grid-template-columns: minmax(0, 280px) 1fr; gap: 16px 24px; margin-top: 16px; }
  .routes { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; align-items: center; }
  .route { background: var(--chip); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .route.bad { background: var(--ng-bg); color: var(--ng); }

  .actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 18px; }
  .kbd-hint { color: var(--faint); font-size: 12px; margin-right: auto; }

  .btn { appearance: none; border: 1px solid transparent; border-radius: 10px; padding: 9px 18px; font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1.2; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .btn.primary { background: var(--primary); color: var(--primary-text); box-shadow: 0 1px 2px rgba(11, 92, 173, .3); }
  .btn.primary:hover:not([disabled]) { background: var(--primary-hover); }
  .btn.ghost { background: var(--card); color: var(--text); border-color: var(--line-strong); }
  .btn.ghost:hover:not([disabled]) { background: var(--chip); }
  .btn.sm { padding: 6px 12px; font-size: 13px; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .btn.is-busy::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .link { background: none; border: 0; padding: 0; font: inherit; color: var(--primary); cursor: pointer; font-weight: 600; }

  .label-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .link.small { font-size: 12.5px; }
  .hint { color: var(--faint); font-size: 12px; margin: 5px 0 0; }
  .optional { font-weight: 400; color: var(--faint); }
  .narrow { max-width: 640px; margin-left: auto; margin-right: auto; }
  .form-grid { display: grid; gap: 16px; margin-top: 4px; }
  .done-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .done-list { margin: 0 0 4px; padding-left: 20px; color: var(--muted); }
  .done-list li + li { margin-top: 6px; }
  .done-list b { color: var(--text); }
  body.mode-newsheet .steps { display: none; }

  .help summary { cursor: pointer; font-weight: 600; color: var(--muted); }
  .help ul { margin: 12px 0 0; padding-left: 20px; color: var(--muted); }
  .help li + li { margin-top: 6px; }
  .help[open] summary { color: var(--text); }

  .alert { padding: 12px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 13.5px; }
  .alert.err { background: var(--ng-bg); color: var(--ng); }
  .alert.warn { background: var(--warn-bg); color: var(--warn); }
  .alert.ok { background: var(--ok-bg); color: var(--ok); }
  .alert ul { margin: 6px 0 0; padding-left: 18px; }

  /* ---------- ringkasan ---------- */
  .summary { padding: 18px 20px; }
  .sum-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .sum-big { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
  .sum-dest { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .dest { font-size: 13px; background: var(--chip); border-radius: 999px; padding: 4px 12px; }
  .dest.bad { background: var(--ng-bg); color: var(--ng); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12.5px; }
  .stat.primary { background: var(--primary-weak); border-color: transparent; }
  .stat.primary b { color: var(--primary); }
  .stat.warn b { color: var(--warn); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 18px 2px 10px; }
  .legend { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
  .swatch { width: 16px; height: 16px; border-radius: 4px; background: #FFF2CC; border: 1px solid #e6d28f; flex: none; }
  .toolbar-actions { display: flex; gap: 16px; font-size: 13px; }

  /* ---------- kartu laporan ---------- */
  .rec { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--primary); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 10px; transition: border-color .15s, opacity .15s; }
  .rec.is-off { border-left-color: var(--line-strong); }
  .rec.is-off .rec-body, .rec.is-off .rec-foot, .rec.is-off .when { opacity: .55; }
  .rec.is-blocked { border-left-color: var(--ng); }
  .rec-head { display: flex; align-items: center; gap: 14px; padding: 14px 16px 10px; cursor: pointer; margin: 0; color: var(--text); font-weight: 400; font-size: 14px; }
  .rec.is-blocked .rec-head { cursor: default; }
  .rec-head input { width: 20px; height: 20px; margin: 0; accent-color: var(--primary); flex: none; cursor: inherit; }
  .when .time { font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .when .arrow { color: var(--faint); font-weight: 400; margin: 0 6px; }
  .when .meta { color: var(--muted); font-size: 12.5px; }
  .tags { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .tag { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .tag.blue { background: var(--primary-weak); color: var(--primary); }
  .tag.amber { background: var(--warn-bg); color: var(--warn); }
  .tag.red { background: var(--ng-bg); color: var(--ng); white-space: normal; }
  .tag.outline { background: transparent; border: 1px solid var(--line); font-weight: 500; }

  .rec-body { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 12px 28px; padding: 4px 16px 14px 50px; }
  .field .k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); font-weight: 700; margin-bottom: 3px; }
  .field .v { overflow-wrap: anywhere; white-space: pre-line; }
  .field.wide { grid-column: 1 / -1; }
  .field .hint { color: var(--faint); font-size: 12px; margin-top: 4px; }
  select.disc { max-width: 260px; }
  select.disc.is-empty { background: var(--cell); color: var(--cell-text); border-color: transparent; font-weight: 600; }
  .empty { display: inline-block; background: var(--cell); color: var(--cell-text); padding: 0 8px; border-radius: 4px; font-size: 12.5px; font-weight: 600; }

  .rec-foot { border-top: 1px dashed var(--line); padding: 10px 16px 12px 50px; display: grid; gap: 6px; }
  .warns { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
  .warns li { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--warn); }
  .cells { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; color: var(--faint); font-size: 12px; }
  .col-chip { font: 700 11px/18px ui-monospace, "SF Mono", Menlo, Consolas, monospace; min-width: 20px; text-align: center; border-radius: 4px;
    background: var(--cell); color: var(--cell-text); padding: 0 4px; flex: none; }
  .col-chip.note { background: var(--chip); color: var(--muted); }

  /* ---------- action bar ---------- */
  .actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); background: color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(16, 24, 40, .06); }
  .actionbar .inner { display: flex; align-items: center; gap: 12px; padding-top: 12px; padding-bottom: 12px; }
  .act-note { margin-left: auto; color: var(--muted); font-size: 13px; }

  /* ---------- hasil ---------- */
  .hero { display: flex; align-items: center; gap: 16px; }
  .hero-icon { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; font-weight: 700; flex: none; background: var(--ok-bg); color: var(--ok); }
  .hero.empty-result .hero-icon { background: var(--warn-bg); color: var(--warn); }
  .hero .grow { flex: 1; min-width: 0; }
  .hero p { margin: 2px 0 0; }
  .card-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 4px; }
  .table-wrap { overflow-x: auto; margin: 10px -20px -8px; padding: 0 20px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-variant-numeric: tabular-nums; font-weight: 700; }
  td.nowrap { white-space: nowrap; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  #mentor-text { min-height: 200px; margin-top: 10px; font-size: 12.5px; }
  .end-actions { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }

  /* ---------- layar kecil ---------- */
  @media (max-width: 720px) {
    header.top .inner, .wrap, .actionbar .inner { padding-left: 16px; padding-right: 16px; }
    .steps li { padding: 4px; }
    .steps li:not(.on) { font-size: 0; gap: 0; }
    .card { padding: 16px; }
    .table-wrap { margin-left: -16px; margin-right: -16px; padding: 0 16px; }
    .opts { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .sum-dest { align-items: flex-start; }
    .rec-head { flex-wrap: wrap; }
    .tags { margin-left: 34px; justify-content: flex-start; width: 100%; }
    .rec-body { grid-template-columns: 1fr; padding-left: 16px; }
    .rec-foot { padding-left: 16px; }
    .kbd-hint { display: none; }
    .act-note { display: none; }
    .actionbar .btn.primary { margin-left: auto; }
    .hero { flex-wrap: wrap; }
  }
</style>
