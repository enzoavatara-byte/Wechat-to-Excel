<style>
  /* Tema gelap ala iOS: latar hitam, kartu abu gelap bersudut besar, aksen merah muda, angka besar. */
  :root {
    --bg: #000; --card: #1c1c1e; --card-2: #2c2c2e; --text: #fff; --muted: #a1a1a6; --faint: #6e6e73;
    --line: #2c2c2e; --line-strong: #3a3a3c; --chip: #2c2c2e;
    --primary: #ff4d6d; --primary-hover: #ff6b86; --primary-text: #fff; --primary-weak: rgba(255, 77, 109, .14);
    --ok: #30d158; --ok-bg: rgba(48, 209, 88, .14);
    --warn: #ffcc66; --warn-bg: rgba(255, 204, 102, .12);
    --ng: #ff6b6b; --ng-bg: rgba(255, 107, 107, .14);
    --shadow: none;
    --radius: 20px;
    --display: "Unbounded", "Arial Black", "Helvetica Neue", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 90px; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
  h2 { font-size: 17px; margin: 0; }
  code, kbd, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  code { background: var(--chip); padding: 1px 5px; border-radius: 6px; font-size: 12.5px; }
  kbd { background: var(--card-2); border: 1px solid var(--line-strong); border-radius: 5px; padding: 0 5px; font-size: 11.5px; }
  a { color: var(--primary); }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .hidden { display: none !important; }
  .center { text-align: center; }
  .loading { text-align: center; padding: 40px 0; color: var(--muted); }

  /* ---------- header: tombol bulat kiri/kanan, judul di tengah ---------- */
  header.top { position: sticky; top: 0; z-index: 10; background: rgba(0, 0, 0, .82);
    backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px); }
  header.top .inner, .wrap, .actionbar .inner { max-width: 1040px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }
  header.top .inner { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 12px; padding-top: 12px; padding-bottom: 10px; }
  .hbtn { position: relative; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--card);
    color: var(--text); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .hbtn:hover { background: var(--card-2); }
  .hbtn svg { width: 20px; height: 20px; }
  .hbtn.sm { width: 38px; height: 38px; background: rgba(0, 0, 0, .25); border-color: rgba(255, 255, 255, .14); }
  .hbtn.sm svg { width: 16px; height: 16px; }
  .hbtn[disabled] { opacity: .35; cursor: default; }
  .hbtn .count { position: absolute; top: -4px; right: -6px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
    background: var(--primary); color: #fff; font-size: 11.5px; font-weight: 700; line-height: 20px; text-align: center; }
  .hbtn .count:empty, .hbtn.no-count .count { display: none; }
  .hbtn .ico { display: grid; place-items: center; }
  .htitle { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 17px; min-width: 0; }
  .htitle span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .logo { flex: none; color: var(--primary); display: grid; place-items: center; }
  .logo svg { width: 24px; height: 24px; }
  .steps { list-style: none; margin: 0 auto; padding: 0 20px 10px; display: flex; justify-content: center; gap: 6px; max-width: 1040px; }
  .steps li { display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 5px; border-radius: 999px; color: var(--faint); font-weight: 600; font-size: 12.5px; }
  .steps li span { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; background: var(--card-2); color: var(--muted); }
  .steps li.on { background: var(--primary-weak); color: var(--primary); }
  .steps li.on span { background: var(--primary); color: var(--primary-text); }
  .steps li.done { color: var(--ok); }
  .steps li.done span { background: var(--ok-bg); color: var(--ok); }
  .foot-info { text-align: center; color: var(--faint); font-size: 12px; margin: 24px 0 0; }

  /* ---------- layout ---------- */
  .wrap { padding-top: 12px; padding-bottom: 120px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
  .lead { margin: 0 0 14px; max-width: 70ch; }
  label, .label { display: block; font-weight: 600; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  textarea, select, input[type=text] { width: 100%; font: inherit; color: var(--text); background: var(--card-2); border: 1px solid var(--line-strong); border-radius: 14px; }
  input[type=text] { padding: 10px 14px; }
  textarea { min-height: 280px; padding: 14px 16px; font-size: 13px; line-height: 1.6; resize: vertical; background: #111113; }
  select { padding: 9px 12px; }
  textarea:focus, select:focus, input[type=text]:focus, .btn:focus-visible, .link:focus-visible, input:focus-visible, .hbtn:focus-visible {
    outline: 2px solid var(--primary); outline-offset: 1px; border-color: transparent; }
  textarea::placeholder, input::placeholder { color: var(--faint); }

  .opts { display: grid; grid-template-columns: minmax(0, 280px) 1fr; gap: 16px 24px; margin-top: 16px; }
  .routes { display: flex; flex-wrap: wrap; gap: 6px; min-height: 38px; align-items: center; }
  .route { background: var(--card-2); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
  .route.bad { background: var(--ng-bg); color: var(--ng); }

  .actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 18px; }
  .kbd-hint { color: var(--faint); font-size: 12px; margin-right: auto; }

  .btn { appearance: none; border: 0; border-radius: 14px; padding: 11px 20px; font-family: inherit; font-size: 15px; font-weight: 600; line-height: 1.2;
    cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .btn.primary { background: var(--primary); color: var(--primary-text); }
  .btn.primary:hover:not([disabled]) { background: var(--primary-hover); }
  .btn.ghost { background: var(--card-2); color: var(--text); }
  .btn.ghost:hover:not([disabled]) { background: var(--line-strong); }
  .btn.sm { padding: 8px 14px; font-size: 13.5px; border-radius: 12px; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btn.is-busy::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .link { background: none; border: 0; padding: 0; font: inherit; color: var(--primary); cursor: pointer; font-weight: 600; }

  .label-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .link.small { font-size: 12.5px; }
  .hint { color: var(--faint); font-size: 12px; margin: 5px 0 0; }
  .optional { font-weight: 400; color: var(--faint); }
  .narrow { max-width: 640px; margin-left: auto; margin-right: auto; }
  .form-grid { display: grid; gap: 16px; margin-top: 4px; }
  .done-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .done-list { margin: 0 0 4px; padding-left: 20px; color: var(--muted); }
  .done-list li + li { margin-top: 6px; }
  .done-list b { color: var(--text); }

  /* ---------- Ringkasan (beranda) ---------- */
  .dash { max-width: 640px; margin: 0 auto; }
  .heat-card { border-radius: 28px; padding: 18px 16px 14px; background: linear-gradient(180deg, #3b1219 0%, #4c1621 100%); }
  .heat-wrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
  .heat-days { display: grid; grid-template-rows: repeat(7, 1fr); gap: 4px; font-size: 10px; font-weight: 700; color: rgba(255, 255, 255, .72); }
  .heat-days span { display: flex; align-items: center; }
  .heat-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, auto); grid-auto-columns: minmax(0, 1fr); gap: 4px; }
  .heat-cell { display: block; width: 100%; min-width: 0; aspect-ratio: 1; border: 0; padding: 0; border-radius: 4px; background: rgba(0, 0, 0, .3); cursor: pointer; }
  .heat-cell.l1 { background: #ffc9d4; }
  .heat-cell.l2 { background: #ff9db1; }
  .heat-cell.l3 { background: #ff6f8c; }
  .heat-cell.l4 { background: #ff3b63; }
  span.heat-cell { cursor: default; }
  .heat-cell.future { background: transparent; }
  .heat-cell.today { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .55); }
  .heat-cell.sel { outline: 2px solid #fff; outline-offset: 1px; }
  .heat-legend { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px; margin-top: 10px;
    font-size: 11.5px; color: rgba(255, 255, 255, .72); }
  .heat-legend .heat-cell { display: inline-block; width: 12px; height: 12px; aspect-ratio: auto; margin-left: 6px; cursor: default; }
  #date-warn .alert { margin: 12px 0 0; }
  .heat-foot { position: relative; display: flex; align-items: center; justify-content: center; min-height: 38px; margin-top: 12px; font-weight: 500; }
  .heat-foot .hbtn.sm:first-child { position: absolute; left: 0; }
  .heat-foot .hbtn.sm:last-child { position: absolute; right: 0; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
  .stat-card { aspect-ratio: 1 / 1; border-radius: 28px; padding: 16px 18px; display: flex; flex-direction: column;
    background: radial-gradient(120% 95% at 45% 45%, #050506 0%, #1c1c1e 72%); }
  .stat-title { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
  .stat-title svg { width: 15px; height: 15px; flex: none; color: var(--primary); }
  .stat-card.go { cursor: pointer; }
  .stat-card.go:hover .stat-foot { color: var(--text); }
  .stat-num { margin: auto 0; font-family: var(--display); font-weight: 700; color: var(--primary); line-height: 1; letter-spacing: .01em;
    font-size: clamp(32px, 10.5vw, 58px); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .stat-num.dim { color: var(--faint); }
  .stat-num small { font-size: .38em; margin-left: 4px; letter-spacing: 0; }
  .stat-foot { font-size: 12.5px; color: var(--faint); }
  .stat-foot b { color: var(--text); font-weight: 600; }
  .progress { height: 7px; border-radius: 7px; background: var(--line-strong); overflow: hidden; margin-top: 4px; }
  .progress > span { display: block; height: 100%; border-radius: 7px; background: var(--primary); }
  .records-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 26px 4px 4px; flex-wrap: wrap; }
  .records-title { font-size: 22px; font-weight: 700; }
  .seg { display: inline-flex; background: var(--card); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .seg button.on { background: var(--card-2); color: var(--text); }
  .seg span:empty { display: none; }
  .rec-filter { display: flex; align-items: center; gap: 8px; margin: 6px 4px 0; color: var(--muted); font-size: 13px; }
  .month { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 17px; margin: 16px 4px 8px; }
  .badge { min-width: 26px; padding: 1px 9px; border-radius: 999px; background: #fff; color: #000; font-size: 13px; font-weight: 700; text-align: center; }
  .rrow { width: 100%; display: flex; text-decoration: none; align-items: center; gap: 12px; padding: 14px 18px; margin-bottom: 8px; border: 0; border-radius: 18px;
    background: var(--card); color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .rrow:hover { background: var(--card-2); }
  .rrow .main, .rrow .sub, .rrow .t, .rrow .dt { display: block; }
  .rrow .main { flex: 1; min-width: 0; }
  .rrow .d { font-size: 17px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .rrow .sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rrow .right { text-align: right; flex: none; }
  .rrow .t { color: var(--muted); font-size: 16px; font-variant-numeric: tabular-nums; }
  .rrow .dt { color: var(--primary); font-size: 12.5px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex: none; }
  .more { display: flex; margin: 6px auto 0; }
  .rec-filter .link { font-size: 13px; }
  .empty-card { text-align: center; padding: 28px 20px; }
  .empty-card p { margin: 0 0 14px; color: var(--muted); }

  /* ---------- pemilih PIC ---------- */
  .pic-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .pic-chip { border: 1px solid var(--line-strong); background: transparent; color: var(--muted); border-radius: 999px; padding: 6px 12px;
    font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .pic-chip:hover { color: var(--text); border-color: var(--faint); }
  .pic-chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .pic-add { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .pic-add input[type=text] { max-width: 240px; padding: 7px 14px; border-radius: 999px; font-size: 13.5px; }
  .pic-add .hint { margin: 0; }
  .picker .label-row { margin-bottom: 6px; }
  .picker .k { margin: 0; }
  .picker.is-missing .k { color: var(--warn); }
  .pic-chip[disabled] { cursor: default; opacity: .6; }

  /* ---------- Lengkapi ---------- */
  .cmp-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .cmp-tools select { width: auto; min-width: 170px; }
  .chat-text { min-height: 260px; margin-top: 10px; font-size: 14px; line-height: 1.55; background: #111113; }
  .rec-head.static { cursor: default; padding-left: 18px; }
  .rec.cmp .rec-body { padding-left: 18px; }
  .rec.is-done { border-left-color: var(--ok); }
  .rec.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--primary); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .cmp-form { border-top: 1px solid var(--line); padding-top: 14px; }
  .cmp-form textarea { min-height: 76px; font-size: 14.5px; padding: 10px 14px; background: var(--card-2); }
  .rec-foot.cmp-actions { display: flex; justify-content: flex-end; align-items: center; gap: 12px; padding-left: 18px; }
  .cmp-status { margin-right: auto; }
  .tag.green { background: var(--ok-bg); color: var(--ok); }
  a.tag { text-decoration: none; }
  .ok-text { color: var(--ok); }
  .btn.danger { color: var(--ng); }
  .btn.danger.armed { background: var(--ng); color: #fff; }
  tr.is-deleted td { opacity: .45; }
  tr.is-deleted td:nth-child(4) { text-decoration: line-through; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30; width: max-content;
    max-width: min(560px, calc(100% - 32px)); padding: 12px 18px; border-radius: 16px; background: var(--card-2);
    border: 1px solid var(--line-strong); box-shadow: 0 10px 30px rgba(0, 0, 0, .5); font-size: 14px; }
  .toast.ok { border-color: var(--ok); }
  .toast a { color: var(--primary); font-weight: 600; }
  .picker .hint .link { font-size: inherit; }
  .toast.err { border-color: var(--ng); color: var(--ng); }

  /* ---------- info laporan & masalah ---------- */
  .info-strip { display: flex; flex-wrap: wrap; gap: 8px; }
  .info { display: flex; flex-direction: column; gap: 1px; min-width: 92px; padding: 8px 13px; border-radius: 14px; background: var(--card-2); }
  .info .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  .info .val { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .info.accent { background: var(--primary-weak); }
  .info.accent .val { color: var(--primary); }
  .problem { border-left: 4px solid var(--primary); background: #241418; border-radius: 14px; padding: 12px 16px; }
  .problem .lbl { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--primary); margin-bottom: 4px; }
  .problem .txt { font-size: 18px; font-weight: 600; line-height: 1.4; white-space: pre-line; overflow-wrap: anywhere; }
  .problem .tr { margin-top: 6px; font-size: 13px; color: var(--muted); white-space: pre-line; overflow-wrap: anywhere; }

  /* ---------- edit isi sel (layar Periksa) ---------- */
  .foot-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .foot-actions { display: flex; gap: 8px; margin-left: auto; }
  .edit-form { border-top: 1px solid var(--line); padding-top: 14px; }
  .edit-form > .wide { grid-column: 1 / -1; }
  .edit-form textarea, .edit-form input[type=text] { font-size: 14px; background: var(--card-2); }
  .edit-form textarea { min-height: 0; padding: 9px 12px; line-height: 1.45; }
  .edit-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; }
  .edit-row select.disc { max-width: none; }
  input.invalid { border-color: var(--ng); }
  .mentor-opts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .mentor-opts label { display: inline-flex; align-items: center; gap: 6px; margin: 0; font-size: 13px; font-weight: 500; color: var(--text); }
  .mentor-opts input { accent-color: var(--primary); }
  .mentor-opts .hint { margin: 0; }
  .warn-text { color: var(--warn); }
  .err-text { color: var(--ng); }

  .help summary { cursor: pointer; font-weight: 600; color: var(--muted); }
  .help ul { margin: 12px 0 0; padding-left: 20px; color: var(--muted); }
  .help li + li { margin-top: 6px; }
  .help[open] summary { color: var(--text); }

  .alert { padding: 13px 16px; border-radius: 16px; margin-bottom: 14px; font-size: 14px; }
  .alert.err { background: var(--ng-bg); color: var(--ng); }
  .alert.warn { background: var(--warn-bg); color: var(--warn); }
  .alert.ok { background: var(--ok-bg); color: var(--ok); }
  .alert ul { margin: 6px 0 0; padding-left: 18px; }

  /* ---------- ringkasan pratinjau ---------- */
  .summary { padding: 18px 20px; }
  .sum-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .sum-big { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .sum-dest { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .dest { font-size: 13px; background: var(--card-2); border-radius: 999px; padding: 5px 12px; }
  .dest.bad { background: var(--ng-bg); color: var(--ng); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
  .stat { border-radius: 18px; padding: 12px 14px; background: var(--card-2); }
  .stat b { display: block; font-family: var(--display); font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12.5px; }
  .stat.primary b { color: var(--primary); }
  .stat.warn b { color: var(--warn); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 18px 4px 10px; }
  .legend { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
  .toolbar-actions { display: flex; gap: 16px; font-size: 13.5px; }

  /* ---------- kartu laporan ---------- */
  .rec { background: var(--card); border-left: 4px solid var(--primary); border-radius: var(--radius); margin-bottom: 12px; transition: border-color .15s, opacity .15s; }
  .rec.is-off { border-left-color: var(--line-strong); }
  .rec.is-off .rec-body, .rec.is-off .rec-foot, .rec.is-off .when { opacity: .5; }
  .rec.is-blocked { border-left-color: var(--ng); }
  .rec-head { display: flex; align-items: center; gap: 14px; padding: 16px 18px 10px; cursor: pointer; margin: 0; color: var(--text); font-weight: 400; font-size: 15px; }
  .rec.is-blocked .rec-head { cursor: default; }
  .rec-head input { width: 22px; height: 22px; margin: 0; accent-color: var(--primary); flex: none; cursor: inherit; }
  .when .time { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .when .arrow { color: var(--faint); font-weight: 400; margin: 0 6px; }
  .when .meta { color: var(--muted); font-size: 13px; }
  .tags { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .tag { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--card-2); color: var(--muted); white-space: nowrap; }
  .tag.blue { background: var(--primary-weak); color: var(--primary); }
  .tag.amber { background: var(--warn-bg); color: var(--warn); }
  .tag.red { background: var(--ng-bg); color: var(--ng); white-space: normal; }
  .tag.outline { background: transparent; border: 1px solid var(--line-strong); font-weight: 500; }

  .rec-body { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px 28px; padding: 4px 18px 16px 54px; }
  .field .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 700; margin-bottom: 4px; }
  .field .v { overflow-wrap: anywhere; white-space: pre-line; }
  .field.wide { grid-column: 1 / -1; }
